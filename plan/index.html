<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planverktøy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Planverktøy: generell, frittståande planteikning for bedrifter med éin eller fleire hallar.
   Opnast i ein vanleg nettlesar. Lagrar i nettlesaren, og planen kan eksporterast og importerast som JSON-fil.
   Mål: 1 eining = 1 cm. */
:root{
  --paper:#f2f4f1; --sheet:#fbfcfa; --ink:#18272b; --muted:#5d6c70; --line:#d3dbd8; --field:#ffffff;
  --wall:#1f2f33; --floor:#eef1ee; --gridc:#d9e0dd;
  --reol:#36525a; --reol-ink:#f4f7f6; --shelf:#c98a1a; --pall:#7a5230; --maskin:#5e6b8c; --cold:#7fb6c9;
  --till:#c4122f; --till-ink:#ffffff; --sone:#3f8f8a; --good:#2b8a4b; --door:#fbfcfa;
  --sel:#1d6fd6; --hit:#e0a100; --danger:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0f1719; --sheet:#152023; --ink:#e3ebe9; --muted:#9aaaae; --line:#2b393c; --field:#1b282b;
  --wall:#d9e3e1; --floor:#1b2629; --gridc:#26353a;
  --reol:#8fb3bc; --reol-ink:#0f1719; --shelf:#e6a93c; --pall:#c08a5a; --maskin:#9aa8cf; --cold:#4d8ea3;
  --till:#ff5c74; --till-ink:#1a0a0d; --sone:#5fb7b0; --good:#5cc882; --door:#152023;
  --sel:#6aa8ff; --hit:#ffcc4d; --danger:#ff8a80; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px}
.wrap{max-width:1300px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1;margin:2px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:2px}
.btn{font-family:var(--body);font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;min-height:32px}
.btn:hover:not(:disabled){border-color:var(--sel)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.btn.danger{color:var(--danger)} .btn.armed{background:var(--danger);border-color:var(--danger);color:var(--sheet)}
.sw{width:13px;height:13px;border-radius:2px;display:inline-block;flex:none}
.spacer{flex:1 1 auto}
.status{font-size:13px;color:var(--muted)} .status.err{color:var(--danger)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--display);font-size:18px;font-weight:600;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:6px 6px 0 0;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--sheet);border-color:var(--line);color:var(--ink)}
.tab.add{color:var(--sel)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.canvas{background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:80vh;min-width:0}
.canvas svg{display:block;height:auto;user-select:none;-webkit-user-select:none}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;text-transform:uppercase;letter-spacing:.06em}
.panel p{margin:0;color:var(--muted);font-size:14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{font-family:var(--body);font-size:15px;font-weight:400;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
label.f textarea{resize:vertical;min-height:60px;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.list button{width:100%;text-align:left;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:5px;padding:6px 8px;cursor:pointer;font-family:var(--body);font-size:14px}
.list button small{display:block;color:var(--muted);font-size:12px}
.search{font-family:var(--body);font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);width:100%}
.banner{background:var(--sheet);border:1px solid var(--hit);border-radius:6px;padding:10px 12px;font-size:14px}

/* SVG */
svg text{font-family:var(--display);fill:var(--ink)}
.floor{fill:var(--floor)} .hallwall{fill:none;stroke:var(--wall)}
.t-reol{fill:var(--reol)} .t-hylle{fill:var(--shelf)} .t-pallreol{fill:var(--pall)} .t-benk{fill:var(--maskin)}
.t-kjol{fill:var(--cold)} .t-kasse{fill:var(--till)} .t-sone{fill:var(--sone);fill-opacity:.14;stroke:var(--sone);stroke-dasharray:6 5}
.t-vegg{fill:var(--wall)} .t-dor{fill:var(--door);stroke:var(--muted);stroke-dasharray:4 3} .t-nod{fill:var(--good)} .t-brann{fill:var(--till)}
.lt{font-weight:600} .lq{font-weight:500;fill:var(--muted)} .lb{font-weight:700}
.in-light{fill:var(--reol-ink);font-weight:600} .in-till{fill:var(--till-ink);font-weight:700} .in-ink{fill:var(--ink);font-weight:700}
.sone-t{fill:var(--sone);font-weight:700}
.obj{cursor:grab;touch-action:none}
.hitbox{fill:transparent}
.obj.hit .shape{stroke:var(--hit)}
.selbox{fill:none;stroke:var(--sel);stroke-dasharray:8 6;pointer-events:none}
.handle{fill:var(--sheet);stroke:var(--sel);touch-action:none}
.rothandle{fill:var(--sheet);stroke:var(--sel);cursor:grab;touch-action:none}
.rothandle:active{cursor:grabbing}
.rotline{stroke:var(--sel);pointer-events:none}
.hallbox{cursor:pointer;touch-action:none}
.hallbox:hover .hb{stroke:var(--sel)}
.hb{fill:var(--floor);stroke:var(--wall)}
.scale{stroke:var(--ink);fill:none}

@media print{
  body{background:#fff;padding:0}
  .bar,.tabs,.side,#banner,.noprint{display:none!important}
  .main{display:block}
  .canvas{border:0;max-height:none;overflow:visible}
  .canvas svg{width:100%!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Planverktøy</div>
    <h1 id="bedrift">Plan</h1>
  </header>

  <div id="banner" class="banner" hidden>Dette er ein dømeplan, så du ser korleis verktøyet verkar. Trykk «Ny tom plan» når du vil starte med dine eigne hallar.</div>

  <div class="bar noprint">
    <div class="grp" id="addgrp" role="group" aria-label="Legg til"><span class="gl">Legg til</span></div>
  </div>
  <div class="bar noprint">
    <div class="grp" role="group" aria-label="Fil">
      <span class="gl">Fil</span>
      <button class="btn" id="b-export">Eksporter</button>
      <button class="btn" id="b-import">Importer</button>
      <input type="file" id="importfile" accept=".json,application/json" hidden>
      <button class="btn" id="b-print">Skriv ut / PDF</button>
      <button class="btn danger" id="b-new">Ny tom plan</button>
      <button class="btn" id="b-demo">Last inn døme</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="btn" id="undo" disabled>Angre</button>
      <button class="btn" id="zoomout" aria-label="Zoom ut">−</button>
      <button class="btn" id="zoomin" aria-label="Zoom inn">+</button>
      <span class="status" id="status"></span>
    </div>
  </div>

  <div class="tabs noprint" id="tabs" role="tablist"></div>

  <div class="main">
    <div class="canvas" id="canvas"><svg id="plan" role="img" aria-label="Planteikning"></svg></div>
    <div class="side">
      <div class="panel" id="insp" aria-live="polite"></div>
      <div class="panel">
        <h2>Finn</h2>
        <input class="search" id="q" type="search" placeholder="Vare, lokasjonskode eller namn" aria-label="Finn">
        <ul class="list" id="results"></ul>
        <p class="hint" id="qhint">Søket leitar i alle hallar: namn, lokasjonskode, innhald og merknader.</p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const KEY='planverktoy-v1';
const TYPES={
  reol:{n:'Reol (to sider)',sw:'var(--reol)',w:200,h:50},
  hylle:{n:'Hylle langs vegg',sw:'var(--shelf)',w:200,h:40},
  pallreol:{n:'Pallreol',sw:'var(--pall)',w:270,h:110},
  benk:{n:'Benk / maskin',sw:'var(--maskin)',w:200,h:80},
  kjol:{n:'Kjøl / frys',sw:'var(--cold)',w:120,h:70},
  kasse:{n:'Kasse / disk',sw:'var(--till)',w:150,h:70},
  sone:{n:'Sone',sw:'var(--sone)',w:400,h:300},
  vegg:{n:'Vegg',sw:'var(--wall)',w:300,h:15},
  dor:{n:'Dør / port',sw:'var(--muted)',w:100,h:20},
  nod:{n:'Nødutgang',sw:'var(--good)',w:100,h:20},
  brann:{n:'Brannslokkar',sw:'var(--till)',w:40,h:40},
  tekst:{n:'Tekst',sw:'transparent',w:0,h:0}
};
const LAYER={sone:0,vegg:1,dor:3,nod:3,brann:3,tekst:4};
const svg=document.getElementById('plan'), insp=document.getElementById('insp'), statusEl=document.getElementById('status');
let S=null, view='oversikt', selId=null, selHall=null, zoom=1, drag=null, F=20, undo=[], FLIP=false, lastTap={};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const first=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean)[0]||'';
const snap=(v,st)=>Math.round(v/(st||10))*(st||10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const m=cm=>(Math.round(cm)/100).toLocaleString('nb-NO',{maximumFractionDigits:2});

/* ---------- data ---------- */
function demo(){
  const A='hA',B='hB';
  const o=(hall,type,x,y,w,h,namn,extra)=>Object.assign({id:uid(),hall,type,x,y,w,h,namn,kode:'',sideA:'',sideB:'',hogde:'',merknad:'',lab:'auto'},extra||{});
  return {versjon:1,demo:true,bedrift:'Dømebedrift AS',
    hallar:[{id:A,namn:'Hall A · Lager',b:4000,l:2000,ox:0,oy:0},{id:B,namn:'Hall B · Verkstad',b:2500,l:1500,ox:4500,oy:250}],
    objekt:[
      o(A,'sone',200,850,2900,300,'Truckgang'),
      o(A,'sone',3200,1250,780,730,'Mottak og utsending'),
      o(A,'pallreol',300,200,2700,110,'Pallreol 1',{kode:'A-01',sideA:'Nivå 1: Sement\nNivå 2: Isolasjon\nNivå 3: Takstein',hogde:600}),
      o(A,'pallreol',300,550,2700,110,'Pallreol 2',{kode:'A-02',sideA:'Nivå 1: Trelast\nNivå 2: Plater',hogde:600}),
      o(A,'pallreol',300,1300,2700,110,'Pallreol 3',{kode:'A-03',sideA:'Nivå 1: Rør\nNivå 2: Koplingar',hogde:600}),
      o(A,'pallreol',300,1650,2700,110,'Pallreol 4',{kode:'A-04',sideA:'Nivå 1: Tomt',hogde:600,merknad:'Ledig frå januar'}),
      o(A,'dor',3400,1990,400,20,'Port 1'),
      o(A,'nod',-10,920,20,120,'Nødutgang'),
      o(A,'brann',60,1200,40,40,'Brannslokkar'),
      o(B,'vegg',1700,0,15,600,'Kontorvegg'),
      o(B,'vegg',1700,600,800,15,'Kontorvegg'),
      o(B,'tekst',2100,320,0,0,'Kontor'),
      o(B,'dor',1900,595,90,25,'Dør kontor'),
      o(B,'benk',200,150,300,80,'Arbeidsbenk 1',{kode:'B-01'}),
      o(B,'benk',650,150,300,80,'Arbeidsbenk 2',{kode:'B-02'}),
      o(B,'benk',300,700,250,120,'Dreiebenk'),
      o(B,'hylle',10,300,40,800,'Verktøyhylle',{kode:'B-H1',sideA:'Handverktøy\nElektroverktøy'}),
      o(B,'reol',800,1000,600,60,'Reol 1',{kode:'B-R1',sideA:'Skruer og bolt',sideB:'Slipeutstyr'}),
      o(B,'dor',1000,1490,400,20,'Port'),
      o(B,'nod',2490,1000,20,120,'Nødutgang'),
      o(B,'brann',2400,700,40,40,'Brannslokkar')
    ]};
}
function blank(){return {versjon:1,bedrift:'Ny bedrift',hallar:[{id:'h'+uid(),namn:'Hall 1',b:2000,l:1000,ox:0,oy:0}],objekt:[]};}
function valid(d){return d&&Array.isArray(d.hallar)&&Array.isArray(d.objekt)&&d.hallar.length>0&&d.hallar.every(h=>h&&h.id&&+h.b>0&&+h.l>0);}
/* Reinsar ein plan før bruk: tal blir tal og tekst blir tekst, så ei importert fil ikkje kan smette kode inn i teikninga.
   Sida deler nettadresse (og nettlesarlager) med varetellinga, så dette er viktig. */
function clean(d){
  const N=(v,def)=>{const n=Number(v); return isFinite(n)?n:(def||0);}, Sx=v=>v==null?'':String(v);
  const LAB=['auto','over','under','venstre','hogre'];
  const out={versjon:1,bedrift:Sx(d.bedrift)};
  if(d.demo) out.demo=true; if(d.anslag) out.anslag=true;
  out.hallar=d.hallar.map(h=>{const o={id:Sx(h.id),namn:Sx(h.namn),b:Math.max(1,N(h.b,1000)),l:Math.max(1,N(h.l,1000)),ox:N(h.ox),oy:N(h.oy)}; if(h.rot) o.rot=N(h.rot); if(h.ute) o.ute=true; return o;});
  const hid=new Set(out.hallar.map(h=>h.id));
  out.objekt=d.objekt.filter(o=>o&&hid.has(Sx(o.hall))).map(o=>{const r={id:Sx(o.id)||uid(),hall:Sx(o.hall),type:TYPES[o.type]?o.type:'benk',x:N(o.x),y:N(o.y),w:Math.max(0,N(o.w)),h:Math.max(0,N(o.h)),
    namn:Sx(o.namn),kode:Sx(o.kode),sideA:Sx(o.sideA),sideB:Sx(o.sideB),hogde:o.hogde===''||o.hogde==null?'':N(o.hogde),merknad:Sx(o.merknad),lab:LAB.includes(o.lab)?o.lab:'auto'};
    if(o.rot) r.rot=N(o.rot); return r;});
  const bg=d.bakgrunn;
  if(bg&&typeof bg.src==='string'&&/^(data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+|https:\/\/[^"'<>\s]+)$/.test(bg.src)) out.bakgrunn={src:bg.src,x:N(bg.x),y:N(bg.y),w:Math.max(1,N(bg.w,1000)),h:Math.max(1,N(bg.h,1000))};
  return out;
}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(valid(d)) return clean(d);}catch(e){}
  return demo();
}
let saveT=null;
function changed(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(S)); statusEl.classList.remove('err');
      statusEl.textContent='Lagra på denne maskina '+new Date().toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit'});}
    catch(e){statusEl.classList.add('err'); statusEl.textContent='Nettlesaren lagrar ikkje. Bruk «Eksporter».';}
  },250);
}
function pushUndo(){undo.push(JSON.stringify(S)); if(undo.length>60) undo.shift(); document.getElementById('undo').disabled=false;}
const hall=id=>S.hallar.find(h=>h.id===id);
const obj=id=>S.objekt.find(o=>o.id===id);

/* ---------- svg helpers ---------- */
function T(x,y,s,cls,size,rot,anchor){
  let tr=rot?'rotate(-90 '+x+' '+y+')':'';
  if(FLIP){const px=rot?x-size*0.35:x, py=rot?y:y-size*0.35; tr='rotate(180 '+px+' '+py+')'+(tr?' '+tr:'');}
  return '<text class="'+cls+'" x="'+x+'" y="'+y+'" font-size="'+size+'" text-anchor="'+(anchor||'middle')+'"'+(tr?' transform="'+tr+'"':'')+'>'+esc(s)+'</text>';
}
const nrm=a=>((a%360)+360)%360;
function flipFor(r){const a=nrm(r||0); return a>90.5&&a<=270.5;}
function rotAttr(r,cx,cy){return r?' transform="rotate('+r+' '+cx+' '+cy+')"':'';}
function boxOf(kind,t){
  if(kind==='hall') return {x:t.ox,y:t.oy,w:t.b,h:t.l,rot:t.rot||0};
  if(t.type==='tekst'){const w=Math.max(F*3,(t.namn||'Tekst').length*F*0.55)+F*0.6; return {x:t.x-w/2,y:t.y-F*1.2,w,h:F*1.6,rot:t.rot||0};}
  return {x:t.x,y:t.y,w:t.w,h:t.h,rot:t.rot||0};
}
function setBox(kind,t,b){ if(kind==='hall'){t.ox=b.x;t.oy=b.y;t.b=b.w;t.l=b.h;} else {t.x=b.x;t.y=b.y;t.w=b.w;t.h=b.h;} }
const HD=[['nw',-1,-1],['n',0,-1],['ne',1,-1],['e',1,0],['se',1,1],['s',0,1],['sw',-1,1],['w',-1,0]];
const HA={e:0,se:45,s:90,sw:135,w:180,nw:225,n:270,ne:315};
function cursorFor(n,r){return ['ew-resize','nwse-resize','ns-resize','nesw-resize'][Math.round(nrm(HA[n]+r)%180/45)%4];}
function overlay(b,canSize){
  const cx=b.x+b.w/2, cy=b.y+b.h/2, pad=F*0.25, hs=F*0.6, x=b.x-pad, y=b.y-pad, w=b.w+2*pad, h=b.h+2*pad, ry=y-F*1.8;
  let s='<g'+rotAttr(b.rot,cx,cy)+'>';
  s+='<rect class="selbox" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" stroke-width="'+F*0.1+'"/>';
  s+='<line class="rotline" x1="'+cx+'" y1="'+y+'" x2="'+cx+'" y2="'+(ry+F*0.5)+'" stroke-width="'+F*0.1+'"/>';
  s+='<circle class="rothandle" data-rh="1" cx="'+cx+'" cy="'+ry+'" r="'+F*0.5+'" stroke-width="'+F*0.14+'"><title>Dra for å rotere</title></circle>';
  if(canSize){
    const thinH=b.h<F*1.5, thinW=b.w<F*1.5;
    const show=thinH&&thinW?['se']:thinH?['e','w']:thinW?['n','s']:null;
    HD.forEach(([n,sx,sy])=>{ if(show&&!show.includes(n)) return;
      const hx=cx+sx*w/2, hy=cy+sy*h/2;
      s+='<rect class="handle" data-hd="'+sx+','+sy+'" x="'+(hx-hs/2)+'" y="'+(hy-hs/2)+'" width="'+hs+'" height="'+hs+'" rx="'+hs*0.2+'" stroke-width="'+F*0.1+'" style="cursor:'+cursorFor(n,b.rot)+'"><title>Dra for å endre storleik</title></rect>';
    });
  }
  return s+'</g>';
}
function trunc(s,len,size){const mx=Math.max(4,Math.floor(len/(size*0.56))); return s.length>mx?s.slice(0,mx-1)+'…':s;}
function pt(e){const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse());}

/* ---------- hall view ---------- */
function labelOut(o,s,side,sz){
  const cx=o.x+o.w/2, cy=o.y+o.h/2, g=sz*0.4, horiz=o.w>=o.h;
  s=trunc(s,(horiz?o.w:o.h)+sz*6,sz);
  if(side==='over') return T(cx,o.y-g,s,'lt',sz);
  if(side==='under') return T(cx,o.y+o.h+g+sz*0.8,s,'lt',sz);
  if(side==='venstre') return T(o.x-g,cy,s,'lt',sz,true);
  return T(o.x+o.w+g+sz*0.8,cy,s,'lt',sz,true);
}
function autoSide(o,h){
  const horiz=o.w>=o.h;
  if(horiz) return (o.y+o.h/2)<h.l/2?'under':'over';
  return (o.x+o.w/2)<h.b/2?'hogre':'venstre';
}
function labelIn(o,s,cls,sz){
  const cx=o.x+o.w/2, cy=o.y+o.h/2, horiz=o.w>=o.h, rot=!horiz&&o.w<sz*4;
  const len=(rot?o.h:o.w)*0.92, thick=rot?o.w:o.h;
  const z=Math.max(sz*0.55,Math.min(sz,thick*0.7,len/(Math.max(1,s.length)*0.56)));
  if(rot) return T(cx+z*0.33,cy,trunc(s,len,z),cls,z,true);
  return T(cx,cy+z*0.33,trunc(s,len,z),cls,z);
}
function pre(o,s){return o.kode?(s?o.kode+' · '+s:o.kode):s;}
function renderObj(o,h,q){ FLIP=flipFor(o.rot); const r=renderObjIn(o,h,q); FLIP=false; return r; }
function renderObjIn(o,h,q){
  const sz=F, hit=q&&matches(o,q);
  const rc=o.type==='tekst'?[o.x,o.y-sz*0.4]:[o.x+o.w/2,o.y+o.h/2];
  let g='<g class="obj'+(hit?' hit':'')+'" data-id="'+esc(o.id)+'"'+rotAttr(o.rot,rc[0],rc[1])+'>';
  if(o.type==='tekst'){
    const s=o.namn||'Tekst', w=Math.max(sz*3,s.length*sz*0.55);
    g+='<rect class="hitbox shape" x="'+(o.x-w/2-sz*0.3)+'" y="'+(o.y-sz*1.2)+'" width="'+(w+sz*0.6)+'" height="'+(sz*1.6)+'" rx="'+sz*0.2+'" stroke-width="'+sz*0.15+'"/>';
    return g+T(o.x,o.y,s,'lb',sz*1.2)+'</g>';
  }
  const sw=o.type==='sone'?sz*0.08:sz*0.25;
  if(o.type==='brann'){
    const r=Math.min(o.w,o.h)/2;
    g+='<circle class="shape t-brann" cx="'+(o.x+o.w/2)+'" cy="'+(o.y+o.h/2)+'" r="'+r+'" stroke-width="'+sw+'"/>';
    g+='<rect class="hitbox" x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'"/>';
    const rt=(o.x+o.w/2)>h.b*0.7;
    return g+T(rt?o.x-sz*0.4:o.x+o.w+sz*0.4,o.y+o.h/2+sz*0.3,o.namn||'Brannslokkar','lq',sz*0.85,false,rt?'end':'start')+'</g>';
  }
  g+='<rect class="shape t-'+o.type+'" x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" rx="'+(o.type==='sone'?sz*0.3:sz*0.08)+'" stroke-width="'+sw+'"/>';
  const thick=Math.min(o.w,o.h), horiz=o.w>=o.h, A=first(o.sideA), B=first(o.sideB), N=o.namn||TYPES[o.type].n;
  const lab=(o.lab&&o.lab!=='auto')?o.lab:autoSide(o,h);
  if(o.type==='reol'){
    if(thick>=sz*2.6){
      const lines=[pre(o,A||N),B].filter(Boolean);
      lines.forEach((s,i)=>{const off=(i-(lines.length-1)/2)*sz*1.15;
        g+=horiz?T(o.x+o.w/2,o.y+o.h/2+off+sz*0.33,trunc(s,o.w,sz),'in-light',sz):T(o.x+o.w/2+off+sz*0.33,o.y+o.h/2,trunc(s,o.h,sz),'in-light',sz,true);});
    } else {
      g+=labelOut(o,pre(o,A||N),horiz?'over':'venstre',sz);
      if(B) g+=labelOut(o,B,horiz?'under':'hogre',sz);
    }
  } else if(o.type==='hylle'){
    const s=pre(o,A||N);
    g+=thick>=sz*1.2?labelIn(o,s,'in-ink',sz):labelOut(o,s,lab,sz);
  } else if(o.type==='pallreol'||o.type==='benk'){
    const s=pre(o,N);
    g+=thick>=sz*1.2?labelIn(o,s,'in-light',sz):labelOut(o,s,lab,sz);
  } else if(o.type==='kjol'){
    g+=thick>=sz*1.0?labelIn(o,N,'in-ink',sz):labelOut(o,N,lab,sz);
  } else if(o.type==='kasse'){
    g+=thick>=sz*1.0?labelIn(o,N,'in-till',sz):labelOut(o,N,lab,sz);
  } else if(o.type==='sone'){
    g+=T(o.x+sz*0.5,o.y+sz*1.2,trunc(N,o.w,sz),'sone-t',sz,false,'start');
  } else if(o.type==='dor'||o.type==='nod'){
    if(o.type==='nod'||o.namn) g+=labelOut(o,N,lab==='auto'?autoSide(o,h):lab,sz*0.85);
  }
  return g+'</g>';
}
function renderHall(){

  let s='<defs><pattern id="g" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="var(--gridc)" stroke-width="'+(W/5)+'"/></pattern></defs>';

  const bar=h.b>=1500?500:100, by=h.l+M*0.55;
  s+='<path class="scale" d="M0 '+(by-F*0.4)+'V'+by+'H'+bar+'V'+(by-F*0.4)+'" stroke-width="'+(W/2.5)+'"/>'+T(bar+F*0.5,by,(bar/100)+' m','lq',F*0.85,false,'start');
  s+=objs.map(o=>renderObj(o,h,q)).join('');

/* ---------- oversikt ---------- */
function renderSite(){
  const hs=S.hallar, bg=S.bakgrunn;
  const pts=[]; hs.forEach(h=>{const cx=h.ox+h.b/2, cy=h.oy+h.l/2, r=(h.rot||0)*Math.PI/180, c=Math.cos(r), sn=Math.sin(r);
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,b])=>{const lx=a*h.b/2, ly=b*h.l/2; pts.push([cx+lx*c-ly*sn, cy+lx*sn+ly*c]);});});
  let x0=Math.min(...pts.map(q=>q[0])), y0=Math.min(...pts.map(q=>q[1])), x1=Math.max(...pts.map(q=>q[0])), y1=Math.max(...pts.map(q=>q[1]));
  if(bg){x0=Math.min(x0,bg.x); y0=Math.min(y0,bg.y); x1=Math.max(x1,bg.x+bg.w); y1=Math.max(y1,bg.y+bg.h);}
  const M=bg?Math.max(x1-x0,y1-y0)*0.06:Math.max(600,Math.max(x1-x0,y1-y0)*0.12), vw=x1-x0+2*M, vh=y1-y0+2*M; F=vw/55;
  svg.setAttribute('viewBox',(x0-M)+' '+(y0-M)+' '+vw+' '+vh);
  svg.setAttribute('aria-label','Områdekart med alle hallar');
  let s='';
  if(bg) s+='<image href="'+esc(bg.src)+'" x="'+bg.x+'" y="'+bg.y+'" width="'+bg.w+'" height="'+bg.h+'" opacity="0.75" preserveAspectRatio="none"/>';
  hs.forEach(h=>{
    const cx=h.ox+h.b/2, cy=h.oy+h.l/2, dim=m(h.b)+' × '+m(h.l)+' m';
    const z1=Math.min(F*1.3,h.l*0.42,h.b*0.9/(Math.max(1,h.namn.length)*0.56)), z2=Math.min(F*0.9,h.l*0.3,h.b*0.9/(dim.length*0.5));
    FLIP=flipFor(h.rot);
    s+='<g class="hallbox" data-hid="'+esc(h.id)+'"'+rotAttr(h.rot,cx,cy)+'><rect class="hb" x="'+h.ox+'" y="'+h.oy+'" width="'+h.b+'" height="'+h.l+'" stroke-width="'+F*0.2+'" rx="'+F*0.15+'"'
      +(bg?' fill-opacity="'+(h.ute?0.35:0.8)+'"':'')+(h.ute?' stroke-dasharray="'+F*0.6+' '+F*0.4+'"':'')+'/>'
      +T(cx,cy-z1*0.1,h.namn,'lb',z1)+T(cx,cy+z2*1.1,dim,'lq',z2)+'</g>';
    FLIP=false;
  });

  s+=T(x0-M*0.5,y0-M*0.35,'Trykk på ein hall for å velje han, dobbeltklikk for å opne han.','lq',F*0.8,false,'start');
  svg.innerHTML=s;
}

  }
  const g=e.target.closest('.obj');
  if(g){ e.preventDefault(); const o=obj(g.dataset.id); if(selId!==o.id){selId=o.id; render(); renderInsp();}
    drag={mode:'move',kind:'obj',t:o,o0:{x:o.x,y:o.y},p0:pt(e),moved:false,snap:JSON.stringify(S)}; svg.setPointerCapture(e.pointerId); return; }
  if(selId){selId=null; render(); renderInsp();}
});
svg.addEventListener('pointermove',e=>{
  if(!drag) return; const p=pt(e), dx=p.x-drag.p0.x, dy=p.y-drag.p0.y;
  if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>F*0.3) drag.moved=true; if(!drag.moved) return;
  const hallK=drag.kind==='hall';
  if(drag.mode==='move'){
    const st=hallK?100:10;
    if(hallK){drag.t.ox=snap(drag.o0.x+dx,st); drag.t.oy=snap(drag.o0.y+dy,st);} else {drag.t.x=snap(drag.o0.x+dx,st); drag.t.y=snap(drag.o0.y+dy,st);}
  } else if(drag.mode==='size'){
    const b0=drag.b0, st=hallK?50:10, r=b0.rot*Math.PI/180, c=Math.cos(r), sn=Math.sin(r);
    const du=dx*c+dy*sn, dv=-dx*sn+dy*c;
    const w=drag.sx?Math.max(st,snap(b0.w+drag.sx*du,st)):b0.w, hh=drag.sy?Math.max(st,snap(b0.h+drag.sy*dv,st)):b0.h;
    const lx=drag.sx*(w-b0.w)/2, ly=drag.sy*(hh-b0.h)/2;
    const cx=b0.x+b0.w/2+lx*c-ly*sn, cy=b0.y+b0.h/2+lx*sn+ly*c;
    setBox(drag.kind,drag.t,{x:Math.round(cx-w/2),y:Math.round(cy-hh/2),w,h:hh});
  } else {
    const b0=drag.b0, cx=b0.x+b0.w/2, cy=b0.y+b0.h/2;
    let a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90;
    if(e.shiftKey) a=Math.round(a/15)*15; else { a=Math.round(a); const n90=Math.round(a/90)*90; if(Math.abs(a-n90)<=5) a=n90; }
    a=nrm(a); if(a>180) a-=360; drag.t.rot=a;
  }
  render();
});
function endDrag(){
  if(!drag) return; const d=drag; drag=null;
  if(d.moved){undo.push(d.snap); if(undo.length>60) undo.shift(); document.getElementById('undo').disabled=false; changed(); renderInsp(); return;}
  if(d.kind==='hall'&&d.mode==='move'){
    const now=Date.now();
    if(lastTap.id===d.t.id&&now-lastTap.t<450){view=d.t.id; selId=null; selHall=null; lastTap={}; render(); renderInsp();}
    else lastTap={id:d.t.id,t:now};
  }
}
svg.addEventListener('pointerup',endDrag); svg.addEventListener('pointercancel',endDrag);
let nudgeT=null;
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!k) return;
  const site=view==='oversikt', t=site?hall(selHall):obj(selId); if(!t) return;
  e.preventDefault();
  if(!nudgeT) pushUndo(); clearTimeout(nudgeT); nudgeT=setTimeout(()=>{nudgeT=null; renderInsp();},700);
  if(site){const st=e.shiftKey?500:100; t.ox+=k[0]*st; t.oy+=k[1]*st;} else {const st=e.shiftKey?50:10; t.x+=k[0]*st; t.y+=k[1]*st;}
  changed(); render();
});

/* ---------- toolbar ---------- */
document.getElementById('undo').addEventListener('click',()=>{
  const u=undo.pop(); if(!u) return; S=JSON.parse(u);
  if(selId&&!obj(selId)) selId=null; if(selHall&&!hall(selHall)) selHall=null; document.getElementById('undo').disabled=!undo.length; changed(); render(); renderInsp();
});
document.getElementById('zoomin').addEventListener('click',()=>{zoom=Math.min(4,zoom+0.5); render();});
document.getElementById('zoomout').addEventListener('click',()=>{zoom=Math.max(1,zoom-0.5); render();});
document.getElementById('b-export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=((S.bedrift||'plan').replace(/[^\wæøåÆØÅ-]+/g,'_'))+'_plan_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  statusEl.textContent='Eksportert';
});
const fileIn=document.getElementById('importfile');
document.getElementById('b-import').addEventListener('click',()=>fileIn.click());
fileIn.addEventListener('change',()=>{
  const f=fileIn.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{const d=JSON.parse(r.result); if(!valid(d)) throw 0; pushUndo(); S=clean(d); view='oversikt'; selId=null; selHall=null; changed(); render(); renderInsp(); statusEl.textContent='Importert «'+f.name+'»';}
    catch(e){statusEl.classList.add('err'); statusEl.textContent='Fila er ikkje ein plan frå Planverktøy.';} fileIn.value=''; };
  r.readAsText(f);
});
document.getElementById('b-print').addEventListener('click',()=>window.print());
twoStep(document.getElementById('b-new'),'Ny tom plan',()=>{pushUndo(); S=blank(); view=S.hallar[0].id; selId=null; selHall=null; changed(); render(); renderInsp();});
document.getElementById('b-demo').addEventListener('click',()=>{pushUndo(); S=demo(); view='oversikt'; selId=null; selHall=null; changed(); render(); renderInsp();});

/* ---------- search ---------- */
const qEl=document.getElementById('q');
function curQuery(){return qEl.value.trim().toLowerCase();}
function matches(o,q){return [o.namn,o.kode,o.sideA,o.sideB,o.merknad].join('\n').toLowerCase().includes(q);}
qEl.addEventListener('input',render);
function renderResults(){
  const q=curQuery(), ul=document.getElementById('results'), hint=document.getElementById('qhint');
  if(!q){ul.innerHTML=''; hint.textContent='Søket leitar i alle hallar: namn, lokasjonskode, innhald og merknader.'; return;}
  const r=S.objekt.filter(o=>matches(o,q));
  hint.textContent=r.length?r.length+' treff':'Ingen treff for «'+qEl.value.trim()+'».';
  ul.innerHTML=r.map(o=>{const h=hall(o.hall); const line=[o.sideA,o.sideB,o.merknad].join('\n').split('\n').find(l=>l.toLowerCase().includes(q))||'';
    return '<li><button data-id="'+esc(o.id)+'">'+esc(pre(o,o.namn||TYPES[o.type].n))+'<small>'+esc((h?h.namn:'')+(line?' · '+line:''))+'</small></button></li>';}).join('');
}
document.getElementById('results').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; const o=obj(b.dataset.id); if(!o) return; view=o.hall; selId=o.id; selHall=null; render(); renderInsp();});

/* ---------- start ---------- */
S=load(); view='oversikt';
render(); renderInsp();
try{statusEl.textContent=localStorage.getItem(KEY)?'Planen er lasta frå denne maskina':'';}catch(e){}
})();
</script>
