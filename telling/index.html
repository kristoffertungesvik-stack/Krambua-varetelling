    try{ const r = await ghFetch(ghBase()); if (!r.ok) throw await ghErr(r); const j = await r.json(); if (j.permissions && !j.permissions.push) throw new Error('Nøkkelen har ikkje skrivetilgang til repoet');
      markAllPending(); if (Object.keys(CAT.items).length) catDirty = true; await syncNow(true); render(); toast(SYNC.status === 'ok' ? 'Deling er på' : 'Feil: ' + SYNC.err, SYNC.status === 'ok' ? 'ok' : 'err');
    }catch(e){ if (st) st.innerHTML = '<span class="tag err">Feil</span> ' + esc(e.message); SYNC.status = 'feil'; SYNC.err = e.message; updateSyncUI(); }
  },
  'g-sync':() => { closeModal(); syncNow(true).then(() => { if (route.v === 'oppsett') render(); toast(SYNC.status === 'ok' ? 'Synka' : 'Feil: ' + SYNC.err, SYNC.status === 'ok' ? 'ok' : 'err'); }); },
  'g-av':() => confirmBox('Slå av deling?', 'Nøkkelen vert fjerna frå denne eininga. Data i repoet vert ikkje sletta.', 'Slå av', () => { setToken(''); SYNC.status = 'av'; render(); }, true),
  't-opne':el => openTelling(el.dataset.id),
  'hjelp':() => go('hjelp'),
  'hj-goto':el => { const t = document.getElementById(el.dataset.id); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); },
  'hj-top':() => window.scrollTo({top:0, behavior:'smooth'}),
  'kopi-liste':() => kopiListe(),
  'kopi-hent':el => kopiHent(el.dataset.id),
  'kopi-no':async () => { await lagKopi(true); await STORE.chain; kopiListe(); },
  't-ny':() => { const v = $('#t-ny').value.trim().replace(/[^A-Za-z0-9_-]/g, ''); if (!v) return toast('Skriv ein kode, t.d. eit årstal', 'err'); openTelling(v); }
};
async function openTelling(id){
  if (id === T.id) return;
  if (ghOn() && DIRTY.size && !SYNC.busy) await syncNow(true);
  saveSyncState(); await lagKopi(false); await STORE.chain;
  await loadTelling(id); draft = null; listerSel = null;
  toast('Opna telling ' + id, 'ok'); if (ghOn()) syncNow(true); go('kart');
}
document.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]'); if (n){ go(n.dataset.nav); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.dataset.act === 'modal-bg'){ if (e.target === a) closeModal(); return; }
  if (a.tagName === 'BUTTON' || a.tagName === 'A') e.preventDefault();
  fn(a, e);
});
let suggTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'kode'){ clearTimeout(suggTimer); suggTimer = setTimeout(() => { const v = t.value.trim(); if (/^\d{6,}$/.test(v)) { $('#forslag').innerHTML = ''; return; } renderSugg(v); }, 140); return; }
  if (t.id === 'cat-q'){ clearTimeout(suggTimer); suggTimer = setTimeout(() => renderCatList(t.value), 150); return; }
  const f = t.dataset.f; if (!f || !draft) return;
  const v = t.type === 'checkbox' ? t.checked : t.value;
  if (f.startsWith('v.')) draft.vekt[f.slice(2)] = v; else draft[f] = v;
  if (f === 'eining' && draft.modus === 'vekt') { showForm(draft, '#f-total'); return; }
  updateCalc();
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.f === 'eining' && draft){ draft.eining = t.value; if (draft.modus === 'vekt') showForm(draft, '#f-total'); else updateCalc(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#modal-root').innerHTML) closeModal(); else if (!$('#scanner').hidden) Scanner.close(); else if (document.body.classList.contains('preview')) closePreview(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'kode'){ e.preventDefault(); handleCode(t.value); return; }
  if (t.id === 'ny-tellar'){ e.preventDefault(); ACT['add-tellar'](); return; }
  if (t.id === 'cat-q'){ e.preventDefault(); const it = lookupCode(t.value); if (it) catEdit(it.k); return; }
  if (draft && t.closest && t.closest('#vareform') && t.tagName === 'INPUT'){
    e.preventDefault();
    if (t.id === 'f-antal' || t.id === 'f-total') return saveDraft();
    const ins = [...document.querySelectorAll('#vareform input[type=text]')]; const i = ins.indexOf(t);
    if (i > -1 && i < ins.length - 1) ins[i + 1].focus(); else saveDraft();
  }
});
$('#file-vareliste').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) startImport(f); });
$('#file-json').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) jsonInn(f); });
$('#file-sal').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) startSalImport(f); });
window.addEventListener('afterprint', () => {});
function flushSoon(){ if (T && ghOn() && DIRTY.size && Date.now() - SYNC.lastPush > 15000) syncNow(true); }
document.addEventListener('visibilitychange', () => { if (!T) return; if (document.visibilityState === 'visible'){ if (ghOn()) syncNow(); } else { flushSoon(); lagKopi(false); } });
window.addEventListener('pagehide', () => { if (T){ flushSoon(); lagKopi(false); } });
window.addEventListener('online', () => { if (T && ghOn()) syncNow(); });

/* ------------------------------ start ------------------------------ */
document.querySelectorAll('#nav [data-nav]').forEach(b => { if (!NAV_ITEMS.includes(b.dataset.nav)) b.hidden = true; });
if (STAFF) document.title = 'Krambua Varetelling – tilsette';
$('#view').innerHTML = '<div class="card muted">Opnar teljinga…</div>';
(async function boot(){
  const kopla = handleKople();
  await STORE.init();
  DEV = lsGet(LS.eining, null) || (await STORE.kvGet('DEV', null)) || ('e' + Math.random().toString(36).slice(2, 7));
  lsSet(LS.eining, DEV); try{ await STORE.kvSet('DEV', DEV); }catch(e){}
  try{ await STORE.migrate(); }catch(e){ console.warn('Migrering feila', e); }
  const c = await STORE.loadCat();
  CAT = c.cat; SYC = {sha:c.syc.sha || null}; catDirty = !STAFF && !!c.syc.dirty;
  catUA = {}; for (const k in CAT.items) catUA[k] = CAT.items[k].updatedAt || '';
  buildIdx();
  SAL = (await STORE.kvGet('SAL', null)) || {meta:null, items:{}, generisk:{}}; if (!SAL.generisk) SAL.generisk = {};
  await loadTelling(lsGet(LS.active, null) || String(new Date().getFullYear()));
  if (STORE.migratedIds.includes(T.id)){ persistedUA = {}; saveLocal(true); }
  route = parseHash();
  render();
  if (kopla === 'ok') setTimeout(() => toast('Telefonen er kopla til teljinga', 'ok'), 300);
  if (kopla === 'feil') setTimeout(() => toast('Lenka for kopling var ugyldig', 'err'), 300);
  if (ghOn()) syncNow(true);
  if (!curTellar()) setTimeout(() => velTellar(), 400);
  setInterval(() => { if (document.visibilityState === 'visible' && ghOn() && !SYNC.busy) syncNow(); }, POLL_MS);
  setInterval(() => lagKopi(false), window.KRB_TEST_FAST ? 4000 : 15 * 60000);
  setTimeout(() => Scanner.preload(), window.KRB_TEST_FAST ? 300 : 3000);
  setTimeout(() => lagKopi(false), window.KRB_TEST_FAST ? 2000 : 60000);
})().catch(e => { $('#view').innerHTML = `<div class="banner err"><b>Appen klarte ikkje starte:</b> ${esc(e.message || e)}</div>`; console.error(e); });
</script>
</body>
