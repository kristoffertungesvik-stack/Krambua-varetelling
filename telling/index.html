<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263238">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Krambua Varetelling</title>
<style>
:root{--slate:#263238;--reol:#37525A;--ochre:#C98A1A;--kjol:#7FB3C8;--red:#C8102E;--cream:#F6EFE0;--jv:#E6ECEF;--bg:#F2F0EB;--card:#fff;--line:#DCD8CE;--muted:#5D6B70;--ok:#2E8B47;--okbg:#E3F2E7;--warn:#C27700;--warnbg:#FFF2D9;--err:#B3261E;--errbg:#FCE8E6;--txt:#1E2A30;--focus:#2B6CB0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--focus)}
#topbar{position:sticky;top:0;z-index:30;background:var(--slate);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 9px;display:flex;align-items:center;gap:10px}
#topbar .ttl{flex:1;min-width:0}
#topbar .ttl b{display:block;font-size:13.5px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .ttl span{display:block;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pill-btn.need{background:#F2B33D;color:#1E2A30;border-color:#F2B33D;font-weight:600}
#sync{font-size:12px;border-radius:999px;padding:4px 9px;cursor:pointer;border:0;white-space:nowrap}
#sync.av{background:rgba(255,255,255,.12);color:#cfd8dc}
#sync.ok{background:#2E8B47;color:#fff}
#sync.busy{background:#3d5560;color:#fff}
#sync.feil{background:#F2B33D;color:#1E2A30}
main{padding:12px 12px 96px;max-width:860px;margin:0 auto}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button[hidden]{display:none}
#nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--slate);font-weight:700}
#nav button.on svg{stroke:var(--ochre)}
h1{font-size:21px;margin:4px 0 10px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 15px;border-radius:10px;border:1px solid #C9C4B8;background:#fff;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--txt)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--slate);color:#fff;border-color:var(--slate)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ochre{background:var(--ochre);color:#fff;border-color:var(--ochre)}
.btn.danger{color:var(--err);border-color:#E3B5B1}
.btn.ghost{border-color:transparent;background:transparent}
.btn.big{min-height:54px;font-size:17px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btnrow .btn{flex:1 1 auto}
label{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin:10px 0 0}
label input,label select,label textarea{display:block;width:100%;margin-top:4px}
input[type=text],input:not([type]),input[type=password],input[type=date],input[type=number],select,textarea{border:1px solid #C9C4B8;border-radius:9px;padding:10px 11px;background:#fff;min-height:44px;font-size:16px;color:var(--txt);font-weight:500}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(43,108,176,.35);outline-offset:1px;border-color:var(--focus)}
label.check{display:flex;gap:9px;align-items:center;color:var(--txt);font-weight:500;font-size:15px}
label.check input{width:22px;height:22px;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lbl{font-size:13.5px;color:var(--muted);font-weight:600;margin:12px 0 5px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid #C9C4B8;background:#fff;border-radius:999px;padding:8px 15px;font-weight:700;cursor:pointer;min-height:42px;font-size:15px}
.chip.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.seg{display:flex;border:1.5px solid #C9C4B8;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-weight:600;cursor:pointer;min-height:44px;font-size:14.5px}
.seg button+button{border-left:1.5px solid #C9C4B8}
.seg button.on{background:var(--ochre);color:#fff}
.seg.small button{padding:6px;min-height:36px;font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:#ECEAE4;color:var(--muted);vertical-align:middle}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.err{background:var(--errbg);color:var(--err)}
.tag.st1{background:var(--warnbg);color:var(--warn)}
.tag.st2{background:var(--okbg);color:var(--ok)}
.banner{border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:14.5px;border:1px solid}
.banner.warn{background:var(--warnbg);border-color:#F0D49B}
.banner.ok{background:var(--okbg);border-color:#B7DDC2}
.banner.info{background:#EAF1F7;border-color:#C5D7E8}
.banner.err{background:var(--errbg);border-color:#F1C3BF}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.stat b{display:block;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#E4E0D6;border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px}
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:12px;overflow:auto;-webkit-overflow-scrolling:touch}
.mapwrap.zoom svg{width:165%;max-width:none}
svg.map{display:block;width:100%;height:auto;max-width:640px;margin:0 auto;user-select:none;-webkit-user-select:none}
.map .ml{font-size:12.5px;font-weight:600;fill:#22313A}
.map .ml.w{fill:#fff}
.map .sm{font-size:11px;font-weight:500}
.map .rl{font-size:17px;font-weight:700;fill:#22313A}
.map .area{font-size:13px;letter-spacing:3px;font-weight:700;fill:#6B7A80}
.map .hit{fill:transparent;cursor:pointer;pointer-events:all;stroke:transparent;stroke-width:2;rx:4}
.map .hit:hover{fill:rgba(38,50,56,.07);stroke:rgba(38,50,56,.35)}
.map .hit.st1{fill:rgba(242,170,30,.30);stroke:#D98A00}
.map .hit.st2{fill:rgba(46,139,71,.30);stroke:#2E8B47}
.map .hit.h0{fill:url(#hatch);stroke:#8A9599}
.map .hit.h1{fill:rgba(46,139,71,.40);stroke:#2E8B47}
.map .hit.h2{fill:rgba(235,195,30,.50);stroke:#B89400}
.map .hit.h3{fill:rgba(240,135,25,.50);stroke:#C9650A}
.map .hit.h4{fill:rgba(200,30,40,.45);stroke:#B3261E}
.map .badge.h0 rect{fill:#6B7A80}.map .badge.h1 rect{fill:#2E8B47}.map .badge.h2 rect{fill:#8C7100}.map .badge.h3 rect{fill:#B85A08}.map .badge.h4 rect{fill:#B3261E}
.dupg{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;background:#FFFCF5}
.dupg.ok{background:#F6FBF7;border-color:#CFE6D6}
.dupg .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qr svg{display:block;width:100%;max-width:320px;height:auto;margin:0 auto}
.heat-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.map .badge{pointer-events:none}
.map .badge circle{fill:#263238}
.map .badge.st2 circle{fill:#2E8B47}
.map .badge.st1 circle{fill:#C27700}
.map .badge text{fill:#fff;font-size:10.5px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 4px 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1.5px solid}
.seklist{display:flex;flex-direction:column;gap:6px}
.sekrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.sekrow .code{font-weight:800;font-size:13px;background:#ECEAE4;border-radius:6px;padding:3px 6px;min-width:40px;text-align:center}
.sekrow.st1 .code{background:var(--warnbg);color:var(--warn)}
.sekrow.st2 .code{background:var(--okbg);color:var(--ok)}
.sekrow .nm{flex:1;min-width:0}
.sekrow .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sekrow .nm span{font-size:12.5px;color:var(--muted)}
.sekrow .rt{text-align:right;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grp-h{font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.sek-head{display:flex;gap:12px;align-items:flex-start}
.sek-head .code{font-weight:800;font-size:20px;background:var(--slate);color:#fff;border-radius:9px;padding:6px 10px}
.search{display:flex;gap:8px;position:relative}
.search input{flex:1;min-width:0}
#forslag{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.sugg{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#FBFAF7;border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.sugg b{font-weight:600}
.sugg .pr{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.sugg.new{background:var(--warnbg);border-color:#F0D49B}
.form{border:2px solid var(--ochre);border-radius:12px;padding:12px 13px;margin-top:12px;background:#FFFCF5}
.vare-namn{font-size:18px;font-weight:700;line-height:1.25}
.vare-meta{font-size:13px;color:var(--muted);margin-top:3px}
.antal-row{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:8px;margin-top:12px}
.antal-row input{text-align:center;font-size:26px;font-weight:700;min-height:58px;min-width:0;width:100%}
.search input{min-width:0}
.row2>label,.row3>label{min-width:0}
table.t td:first-child{white-space:nowrap}
.antal-row .btn{font-size:26px;min-height:58px;padding:0}
.calc{margin-top:10px;background:#fff;border:1px dashed #C9C4B8;border-radius:9px;padding:9px 11px;font-size:14.5px}
.calc b{font-size:22px}
.sumline{margin-top:12px;font-size:15px;background:var(--slate);color:#fff;border-radius:9px;padding:10px 12px;font-variant-numeric:tabular-nums}
.sumline b{font-size:18px}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.line .nr{font-size:12px;font-weight:700;color:var(--muted);min-width:26px}
.line .mid{flex:1;min-width:0}
.line .mid b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .mid span{font-size:12.5px;color:var(--muted)}
.line .sum{text-align:right;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.line .sum span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.line button{border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:17px}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid #ECE8DF;text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.sum td{font-weight:800;border-top:2px solid var(--slate);border-bottom:0}
.tablewrap{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1E2A30;color:#fff;padding:11px 16px;border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast.err{background:var(--err)}
#toast.ok{background:var(--ok)}
#toast button{background:none;border:0;color:#FFD36E;font-weight:700;margin-left:10px;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,32,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.modal h2{margin-bottom:6px}
.namelist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.namelist .btn{justify-content:flex-start;text-align:left}
.namelist .btn.on{background:var(--slate);color:#fff}
#scanner{position:fixed;inset:0;background:#000;z-index:95}
#scanner[hidden]{display:none}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scanner .frame{position:absolute;left:8%;right:8%;top:32%;height:28%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanner .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF4D4D;box-shadow:0 0 8px #FF4D4D}
#scanner .top{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;text-align:center;color:#fff;font-weight:600;font-size:16px;text-shadow:0 1px 4px #000}
#scanner .bot{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:0;right:0;display:flex;justify-content:center;gap:12px}
#scanner .bot{flex-wrap:wrap;padding:0 12px}
#scanner .bot .btn{min-width:0;flex:1 1 40%;max-width:200px}
#scanner [hidden]{display:none!important}
#scan-msg{padding:0 18px;line-height:1.35}
#scan-info{font-size:11px;font-weight:400;opacity:.7;margin-top:6px;padding:0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.drop{border:2px dashed #C9C4B8;border-radius:12px;padding:18px;text-align:center;background:#FBFAF7}
.itemrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid #ECE8DF;padding:8px 2px;cursor:pointer}
.itemrow:last-child{border-bottom:0}
.itemrow .mid{flex:1;min-width:0}
.itemrow b{display:block;font-weight:600;font-size:14.5px}
.itemrow span{font-size:12.5px;color:var(--muted)}
.hide{display:none!important}
details summary{cursor:pointer;font-weight:700}
.hj{scroll-margin-top:70px}
.hj h2{font-size:19px;margin:0 0 8px}
.hj h3{font-size:15.5px;margin:16px 0 6px}
.hj p,.hj li{font-size:15px;line-height:1.5}
.hj ol,.hj ul{padding-left:22px;margin:6px 0}
.hj li{margin:4px 0}
.hj-steg li{margin:7px 0}
.hj-pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.hj-pill.ok{background:#2E8B47;color:#fff}.hj-pill.busy{background:#3d5560;color:#fff}.hj-pill.feil{background:#F2B33D;color:#1E2A30}.hj-pill.av{background:#E4E7E8;color:#1E2A30}
.hj-flyt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:8px 0 4px}
.hj-flyt span{border:1px solid #C9C4B8;border-radius:8px;padding:5px 9px;background:#fff;color:var(--txt)}
.hj-flyt span.on{border:2px solid var(--ochre);background:#FFF6E6;font-weight:700}
/* ---------- utskrift ---------- */
#print-root{display:none}
body.preview #print-root{display:block;position:fixed;inset:0;overflow:auto;background:#7d878b;z-index:100;-webkit-overflow-scrolling:touch}
body.preview #app,body.preview #nav{display:none}
.pv-bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--slate);color:#fff}
.pv-bar b{flex:1;font-size:14px}
.pv-bar .btn{min-height:40px;padding:6px 13px}
.doc{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;color:#111;font-size:9.5pt;line-height:1.35}
.page{background:#fff;width:210mm;max-width:calc(100vw - 16px);min-height:200mm;margin:10px auto;padding:13mm 12mm;box-shadow:0 2px 10px rgba(0,0,0,.3);position:relative;overflow:hidden}
.doc h1{font-size:17pt;margin:2mm 0 1mm;letter-spacing:.2px}
.doc h2{font-size:11pt;margin:4mm 0 1.5mm;padding-bottom:1mm;border-bottom:1.5px solid #263238}
.doc .firm{font-size:8.5pt;letter-spacing:1.6px;font-weight:700;color:#37474F;text-transform:uppercase}
.doc .sub{color:#444;font-size:9.5pt}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th,.doc td{border-bottom:.6pt solid #BFC5C7;padding:1.3mm 1.4mm;text-align:left;vertical-align:top}
.doc th{background:#ECEFF0;font-size:7.6pt;text-transform:uppercase;letter-spacing:.3px;border-bottom:.9pt solid #263238}
.doc thead{display:table-header-group}
.doc tr{break-inside:avoid}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap}
.doc td.c,.doc th.c{text-align:center;white-space:nowrap}
.doc tr.sum td{font-weight:700;border-top:1.2pt solid #263238;border-bottom:1.2pt solid #263238;background:#F6F7F7}
.doc tr.sub td{background:#FAFAFA;font-weight:600}
.doc .info td{border:0;padding:.45mm 2mm .45mm 0}
.doc .info td:first-child{color:#555;width:46mm}
.doc .box{border:1.2pt solid #263238;padding:3mm 4mm;margin-top:3mm;display:flex;justify-content:space-between;align-items:center;font-size:11.5pt;font-weight:700}
.doc .note{font-size:8pt;color:#333;margin:2.5mm 0 0}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:0 10mm;break-inside:avoid}
.doc .sig div{border-top:.8pt solid #111;padding-top:1mm;font-size:8pt;color:#333;margin-top:10mm}
.doc .sigblock{break-inside:avoid}
.doc .wm{border:1.5pt solid #B3261E;color:#B3261E;background:#FDF0EF;font-weight:800;font-size:9pt;padding:1mm 3mm;letter-spacing:1px;text-align:center;margin:0 0 3mm}
.doc .lh{display:flex;justify-content:space-between;gap:6mm;align-items:flex-start}
.doc .lh .bc{text-align:center;font-size:7.5pt}
.doc .lnum{font-size:22pt;font-weight:800;line-height:1}
.doc .vekt{font-size:7.6pt;color:#444;font-style:italic}
.doc .fld{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:3mm 0 2mm;font-size:8.5pt}
.doc .fld div{border-bottom:.8pt solid #111;padding-bottom:4mm;color:#444}
.doc .blankrow td{height:9.5mm}
.doc .foot{margin-top:4mm;font-size:7.5pt;color:#666}
.doc svg.bcd{display:block}

const pad = n => String(n).padStart(2, '0');
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDato(s){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(s); }
function fmtDato(s){ const d = typeof s === 'string' && s.length === 10 ? parseDato(s) : new Date(s); if (isNaN(d)) return ''; return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function fmtLangDato(s){ const d = parseDato(s); if (isNaN(d)) return ''; return d.getDate()+'. '+MANAD[d.getMonth()]+' '+d.getFullYear(); }
function fmtKl(s){ const d = new Date(s); if (isNaN(d)) return ''; return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtDT(s){ return s ? fmtDato(s)+' kl. '+fmtKl(s) : ''; }
function parseNum(v){
  if (v == null) return NaN;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/[\s ]/g,'').replace(/kr|nok/gi,'');
  if (!s) return NaN;
  s = s.replace(/[^0-9,.\-]/g,'');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1){ s = lc > ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if (lc > -1){ const p = s.split(','); s = p.length > 2 ? p.join('') : s.replace(',','.'); }
  else if (ld > -1){ const p = s.split('.'); if (p.length > 2) s = p.join(''); }
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

function loadScript(urls){
  return new Promise((resolve, reject) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return reject(new Error('Fekk ikkje lasta bibliotek (sjekk internett)'));
      const s = document.createElement('script'); s.src = urls[i++]; s.async = true;
      s.onload = () => resolve(); s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

}
function beep(){
  try{ const C = window.AudioContext || window.webkitAudioContext; const a = beep.ctx || (beep.ctx = new C());
    const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 1150; g.gain.value = .08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + .09);
  }catch(e){}
}
function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

/* ------------------------------ telling ------------------------------ */
function nyTelling(id){
  const t = {id:String(id), v:1, oppretta:nowISO(),
    meta:{namn:'Varetelling '+id, perDato:todayISO(), firma:'Krambua Bensin & Storkiosk AS', orgnr:'', stad:'Skånevik',
          avanse:38, avanseOmr:{}, ukurans:0, ukuransTekst:'', updatedAt:OLD},
    avslutta:{status:false, av:'', tid:'', updatedAt:OLD},
    tellarar:{}, seksjonar:{}, status:{}, linjer:{}, dobbel:{}};
  DEFAULT_TELLARAR.forEach(n => { const k = 't-'+slug(n); t.tellarar[k] = {id:k, namn:n, updatedAt:OLD, deleted:false}; });
  return t;
}
function normTelling(t){
  ['tellarar','seksjonar','status','linjer','dobbel'].forEach(k => { if (!t[k] || typeof t[k] !== 'object') t[k] = {}; });
  if (!t.meta) t.meta = nyTelling(t.id).meta;
  if (!t.avslutta) t.avslutta = {status:false, av:'', tid:'', updatedAt:OLD};
  if (!t.meta.avanseOmr) t.meta.avanseOmr = {};
  return t;
}
/* ------------------------------ lagring på eininga (IndexedDB, med localStorage som naudløysing) ------------------------------ */
function cleanItem(it){ if (!it) return it; const {_s, ...r} = it; return r; }
const STORE = {
  kind:'ls', db:null, persisted:null, chain:Promise.resolve(), err:'', fail:'', migratedIds:[],
  async init(){
    if (window.KRB_FORCE_LS || !('indexedDB' in window)){ this.err = 'IndexedDB manglar'; return; }
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('krambua-telling', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains('linjer')){ const s = d.createObjectStore('linjer', {keyPath:'pk'}); s.createIndex('t', 't'); }
          if (!d.objectStoreNames.contains('varer')) d.createObjectStore('varer', {keyPath:'k'});
          if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
          if (!d.objectStoreNames.contains('kopi')){ const s = d.createObjectStore('kopi', {keyPath:'id'}); s.createIndex('t', 't'); }
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error || new Error('Kunne ikkje opne databasen'));
        r.onblocked = () => rej(new Error('Databasen er låst av ei anna fane'));
        setTimeout(() => rej(new Error('Databasen svarte ikkje')), 8000);
      });
      this.db.onversionchange = () => { try{ this.db.close(); }catch(e){} };
      this.kind = 'idb';
      await this.kvSet('_test', nowISO());
    }catch(e){ this.kind = 'ls'; this.db = null; this.err = (e && e.message) || String(e); }
    try{ if (navigator.storage && navigator.storage.persisted){ this.persisted = await navigator.storage.persisted(); if (!this.persisted && navigator.storage.persist) this.persisted = await navigator.storage.persist(); } }catch(e){}
  },
  req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  done(tx){ return new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error || new Error('Lagringsfeil')); tx.onabort = () => rej(tx.error || new Error('Lagringa vart avbroten (full eining?)')); }); },
  okSave(){ if (this.fail){ this.fail = ''; renderTop(); } },
  async kvGet(k, def){
    if (this.kind !== 'idb') return lsGet('krb-kv-' + k, def);
    const v = await this.req(this.db.transaction('kv').objectStore('kv').get(k));
    return v === undefined ? def : v;
  },
  async kvSet(k, v){
    if (this.kind !== 'idb'){ if (!lsSet('krb-kv-' + k, v)) throw new Error('Lagringsplassen er full'); return; }
    const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); await this.done(tx);
  },
  async loadTelling(id){
    if (this.kind !== 'idb') return normTelling(lsGet(LS.data(id), null) || nyTelling(id));
    const head = await this.kvGet('T:' + id, null);
    const rows = await this.req(this.db.transaction('linjer').objectStore('linjer').index('t').getAll(id));
    const t = normTelling(head ? {...head, id:String(id), linjer:{}} : nyTelling(id));
    rows.forEach(r => { if (r && r.l && r.l.id) t.linjer[r.l.id] = r.l; });
    return t;
  },
  async saveTelling(t, changedIds, st){
    if (this.kind !== 'idb'){
      if (!lsSet(LS.data(t.id), t)) throw new Error('Lagringsplassen i nettlesaren er full');
      if (st) lsSet('krb-kv-S:' + t.id, st);
      return;
    }
    const tx = this.db.transaction(['linjer', 'kv'], 'readwrite');
    const os = tx.objectStore('linjer');
    changedIds.forEach(lid => { const l = t.linjer[lid]; if (l) os.put({pk:t.id + '|' + lid, t:t.id, l}); });
    const {linjer, ...head} = t;
    tx.objectStore('kv').put(head, 'T:' + t.id);
    if (st) tx.objectStore('kv').put(st, 'S:' + t.id);
    await this.done(tx);
  },
  async loadCat(){
    const empty = {v:1, items:{}, meta:{kjelde:'', importert:'', tal:0, updatedAt:OLD}};
    if (this.kind !== 'idb') return {cat:lsGet(LS.cat, null) || empty, syc:lsGet('krb-kv-SC', null) || {sha:null, dirty:!!lsGet(LS.catDirty, false)}};
    const items = await this.req(this.db.transaction('varer').objectStore('varer').getAll());
    const cat = {v:1, items:{}, meta:(await this.kvGet('CATMETA', null)) || empty.meta};
    items.forEach(it => { if (it && it.k) cat.items[it.k] = it; });
    return {cat, syc:(await this.kvGet('SC', null)) || {sha:null, dirty:false}};
  },
  async saveCat(items, meta, syc){
    if (this.kind !== 'idb'){
      const clean = {v:1, items:{}, meta:CAT.meta};
      for (const k in CAT.items) clean.items[k] = cleanItem(CAT.items[k]);
      if (!lsSet(LS.cat, clean)) throw new Error('Lagringsplassen i nettlesaren er full');
      if (syc) lsSet('krb-kv-SC', syc);
      return;
    }
    const tx = this.db.transaction(['varer', 'kv'], 'readwrite');
    const os = tx.objectStore('varer');
    items.forEach(it => { if (it && it.k) os.put(cleanItem(it)); });
    tx.objectStore('kv').put(meta, 'CATMETA');
    if (syc) tx.objectStore('kv').put(syc, 'SC');
    await this.done(tx);
  },
  async addKopi(t){
    if (this.kind !== 'idb') return;
    const tid = nowISO();
    const tx = this.db.transaction('kopi', 'readwrite');
    tx.objectStore('kopi').put({id:t.id + '|' + tid, t:t.id, tid, n:Object.values(t.linjer).filter(l => !l.deleted).length, data:JSON.stringify(t)});
    await this.done(tx);
    const keys = await this.req(this.db.transaction('kopi').objectStore('kopi').index('t').getAllKeys(t.id));
    keys.sort();
    const old = keys.slice(0, Math.max(0, keys.length - 12));
    if (old.length){ const tx2 = this.db.transaction('kopi', 'readwrite'); old.forEach(k => tx2.objectStore('kopi').delete(k)); await this.done(tx2); }
  },
  async listKopi(id){
    if (this.kind !== 'idb') return [];
    const r = await this.req(this.db.transaction('kopi').objectStore('kopi').index('t').getAll(id));
    return r.map(k => ({id:k.id, tid:k.tid, n:k.n})).sort((a, b) => b.tid.localeCompare(a.tid));
  },
  async getKopi(kid){ return this.kind === 'idb' ? this.req(this.db.transaction('kopi').objectStore('kopi').get(kid)) : null; },
  async migrate(){
    if (this.kind !== 'idb') return;
    const ids = new Set(lsGet(LS.list, [])); const act = lsGet(LS.active, null); if (act) ids.add(act);
    for (const id of ids){
      const raw = lsGet(LS.data(id), null); if (!raw || !raw.linjer) continue;
      const ex = await this.loadTelling(id);
      const m = mergeTelling(ex, normTelling(raw));
      await this.saveTelling(m, Object.keys(m.linjer), null);
      const chk = await this.loadTelling(id);
      if (Object.keys(chk.linjer).length >= Object.keys(raw.linjer).length){
        try{ localStorage.removeItem(LS.data(id)); localStorage.removeItem(LS.dirty(id)); }catch(e){}
        this.migratedIds.push(String(id));
      }
    }
    const rc = lsGet(LS.cat, null);
    if (rc && rc.items){
      const c = await this.loadCat(); const mc = mergeCat(c.cat, rc);
      await this.saveCat(Object.values(mc.items), mc.meta, {sha:null, dirty:!!lsGet(LS.catDirty, false)});
      try{ localStorage.removeItem(LS.cat); localStorage.removeItem(LS.catDirty); }catch(e){}
    }
    const rs = lsGet(LS.sal, null);
    if (rs){ await this.kvSet('SAL', rs); try{ localStorage.removeItem(LS.sal); }catch(e){} }
  }
};

let T = null;
let tVersion = 0, persistedUA = {}, headStable = '', kopiSig = '';
const PEND = new Set(), DIRTY = new Set();
let fileVer = {};
let SY = {known:{}, dirSha:null, legacySha:null, devs:{}};
let DEV = '';
const fileForSek = s => `${s}__${DEV}.json`;
const metaFile = () => `_meta__${DEV}.json`;
function markFile(n){ DIRTY.add(n); fileVer[n] = (fileVer[n] || 0) + 1; }
function syncStateObj(){ return {known:SY.known, dirSha:SY.dirSha, legacySha:SY.legacySha, devs:SY.devs, pend:[...PEND], dirty:[...DIRTY]}; }
async function loadTelling(id){
  await STORE.chain;
  T = await STORE.loadTelling(String(id));
  const s = (await STORE.kvGet('S:' + T.id, null)) || {};
  SY = {known:s.known || {}, dirSha:s.dirSha || null, legacySha:s.legacySha || null, devs:s.devs || {}};
  PEND.clear(); DIRTY.clear(); fileVer = {};
  (s.pend || []).forEach(x => PEND.add(x));
  (s.dirty || []).forEach(x => markFile(x));
  persistedUA = {};
  for (const lid in T.linjer){ const l = T.linjer[lid]; persistedUA[lid] = (l.updatedAt || '') + '|' + l.sek; }
  PEND.forEach(lid => { const l = T.linjer[lid]; if (l) markFile(fileForSek(l.sek)); else PEND.delete(lid); });
  const {linjer, ...head} = T; headStable = stable(head);
  lsSet(LS.active, T.id);
  const list = lsGet(LS.list, []); if (!list.includes(T.id)){ list.push(T.id); lsSet(LS.list, list); }
  kopiSig = '';
}
function saveLocal(markDirty=true){
  const changed = [];
  for (const lid in T.linjer){
    const l = T.linjer[lid], sig = (l.updatedAt || '') + '|' + l.sek, prev = persistedUA[lid];
    if (prev === sig) continue;
    changed.push(lid); persistedUA[lid] = sig;
    if (markDirty){
      PEND.add(lid); markFile(fileForSek(l.sek));
      const ps = prev ? prev.slice(prev.lastIndexOf('|') + 1) : null;
      if (ps && ps !== l.sek) markFile(fileForSek(ps));
    }
  }
  const {linjer, ...head} = T; const hs = stable(head); let headCh = false;
  if (hs !== headStable){ headCh = true; if (markDirty) markFile(metaFile()); headStable = hs; }
  if (changed.length || headCh || markDirty){
    const t = T, st = syncStateObj(), post = changed.length || headCh;
    STORE.chain = STORE.chain.then(() => STORE.saveTelling(t, changed, st)).then(() => { STORE.okSave(); if (post) bcPost(); }).catch(storageFail);
  }
  if (markDirty){ tVersion++; scheduleSync(); }
  updateSyncUI();
}
function saveSyncState(){ const id = T.id, st = syncStateObj(); STORE.chain = STORE.chain.then(() => STORE.kvSet('S:' + id, st)).catch(storageFail); }
function markAllPending(){
  Object.values(T.linjer).forEach(l => { PEND.add(l.id); markFile(fileForSek(l.sek)); });
  markFile(metaFile()); saveSyncState();
}
async function lagKopi(force){
  if (STORE.kind !== 'idb' || !T) return;
  let mx = ''; for (const lid in T.linjer){ const u = T.linjer[lid].updatedAt || ''; if (u > mx) mx = u; }
  const sig = T.id + '|' + Object.keys(T.linjer).length + '|' + mx;
  if (!Object.keys(T.linjer).length || (!force && sig === kopiSig)) return;
  kopiSig = sig;
  const t = T;
  STORE.chain = STORE.chain.then(() => STORE.addKopi(t)).catch(e => console.warn('Kopi feila', e));
}
const locked = () => !!(T.avslutta && T.avslutta.status);
function newer(x, y){
  if (!x) return y; if (!y) return x;
  const a = x.updatedAt || '', b = y.updatedAt || '';
  if (a !== b) return b > a ? y : x;
  if (x === y) return x;
  if ('antal' in x && x.antal === y.antal && x.sek === y.sek && !!x.deleted === !!y.deleted && x.pris === y.pris && x.namn === y.namn && x.mva === y.mva) return x;
  return stable(y) > stable(x) ? y : x;
}
function mergeMap(a={}, b={}){ const o = {...a}; for (const k in b) o[k] = newer(a[k], b[k]); return o; }
function mergeTelling(a, b){
  a = normTelling(a); b = normTelling(b);
  return {id:a.id, v:1, oppretta:[a.oppretta, b.oppretta].filter(Boolean).sort()[0] || nowISO(),
    meta:newer(a.meta, b.meta), avslutta:newer(a.avslutta, b.avslutta),
    tellarar:mergeMap(a.tellarar, b.tellarar), seksjonar:mergeMap(a.seksjonar, b.seksjonar),
    status:mergeMap(a.status, b.status), linjer:mergeMap(a.linjer, b.linjer), dobbel:mergeMap(a.dobbel, b.dobbel)};
}
function allSek(){
  const extra = Object.values(T.seksjonar).filter(s => !s.deleted).sort((a,b) => a.id.localeCompare(b.id)).map(s => ({...s, omr:'X'}));
  return [...SEKSJONAR, ...extra];
}
function sekById(id){ return allSek().find(s => s.id === id) || Object.values(T.seksjonar).find(s => s.id === id) || null; }
function tellarList(){ return Object.values(T.tellarar).filter(t => !t.deleted).sort((a,b) => a.namn.localeCompare(b.namn, 'nb')); }
function curTellar(){ return lsGet(LS.tellar, ''); }
function avanseFor(sekId){
  const s = sekById(sekId); const o = s && T.meta.avanseOmr ? T.meta.avanseOmr[s.omr] : null;
  const v = parseNum(o); return isNaN(v) ? (parseNum(T.meta.avanse) || 0) : v;
}
function activeLines(sekId){
  let ls = Object.values(T.linjer).filter(l => !l.deleted);
  if (sekId) ls = ls.filter(l => l.sek === sekId);
  return ls.sort((a,b) => (a.tid||'').localeCompare(b.tid||'') || a.id.localeCompare(b.id));
}
function grpKey(l){ return l.key ? 'K:' + l.key : (l.ean ? 'E:' + String(l.ean).replace(/\s+/g, '') : 'N:' + slug(l.namn || '')); }
function dobbelGroups(){
  const g = new Map();
  activeLines().forEach(l => { const k = grpKey(l); if (!g.has(k)) g.set(k, []); g.get(k).push(l); });
  const out = [];
  g.forEach((ls, k) => {
    if (ls.length < 2) return;
    const sig = ls.map(l => l.id).sort().join(',');
    const chk = T.dobbel[k];
    out.push({k, ls, sekN:new Set(ls.map(l => l.sek)).size, sig, ok:!!(chk && chk.ok && chk.sig === sig), chk});
  });
  out.sort((a, b) => (a.ok - b.ok) || (b.sekN - a.sekN) || a.ls[0].namn.localeCompare(b.ls[0].namn, 'nb'));
  return out;
}
function lineCalc(l){
  const antal = parseNum(l.antal) || 0, pris = parseNum(l.pris) || 0, sats = parseNum(l.mva) || 0;
  const inkl = round2(antal * pris);
  const eks = round2(inkl / (1 + sats / 100));
  const mva = round2(inkl - eks);
  const inn = parseNum(l.innpris);
  const av = avanseFor(l.sek);
  let kost, metode;
  if (!isNaN(inn) && inn > 0){ kost = round2(antal * inn); metode = 'I'; }
  else { kost = round2(eks * (1 - av / 100)); metode = 'A'; }
  return {inkl, eks, mva, kost, metode, avanse:av};
}
function vektAntal(v){
  if (!v) return null;
  const pa = parseNum(v.proveAntal), pv = parseNum(v.proveVekt), t = parseNum(v.total), ta = parseNum(v.tara) || 0;
  if (!(pa > 0 && pv > 0 && t > 0)) return null;
  const netto = t - ta; if (netto <= 0) return 0;
  return Math.round(netto / (pv / pa));
}
function vektTekst(l){
  const v = l.vekt; if (!v) return '';
  const u = v.unit || 'g', pa = parseNum(v.proveAntal), pv = parseNum(v.proveVekt);
  const per = pa > 0 ? pv / pa : 0;
  return `Vege: ${qty(parseNum(v.total))} ${u}${parseNum(v.tara) ? ' − tara '+qty(parseNum(v.tara))+' '+u : ''}; prøve ${qty(pa)} ${l.eining} = ${qty(pv)} ${u} (${nfq.format(round2(per*1000)/1000)} ${u}/${l.eining}) → ${qty(parseNum(l.antal))} ${l.eining}`;
}
function sekStats(){
  const st = {};
  allSek().forEach(s => st[s.id] = {n:0, inkl:0, ferdig:false});
  activeLines().forEach(l => { const c = lineCalc(l); if (!st[l.sek]) st[l.sek] = {n:0, inkl:0, ferdig:false}; st[l.sek].n++; st[l.sek].inkl += c.inkl; });
  Object.keys(st).forEach(k => { const s = T.status[k]; st[k].ferdig = !!(s && s.ferdig); st[k].state = st[k].ferdig ? 2 : (st[k].n ? 1 : 0); });
  return st;
}

/* ------------------------------ varelista ------------------------------ */
let CAT = {v:1, items:{}, meta:{kjelde:'', importert:'', tal:0, updatedAt:OLD}};
let catDirty = false, catUA = {}, SYC = {sha:null};
let IDX = null;
function buildIdx(){
  const ean = new Map(), eanNZ = new Map(), varenr = new Map(), list = [];
  for (const k in CAT.items){
    const it = CAT.items[k]; if (it.deleted) continue;
    list.push(it);
    (it.ean || []).forEach(e => { ean.set(e, it); eanNZ.set(e.replace(/^0+/, ''), it); });
    if (it.varenr){ varenr.set(String(it.varenr), it); varenr.set(String(it.varenr).replace(/^0+/, ''), it); }
    it._s = (it.namn + ' ' + (it.varenr||'') + ' ' + (it.ean||[]).join(' ')).toLowerCase();
  }
  list.sort((a,b) => a.namn.localeCompare(b.namn, 'nb'));
  IDX = {ean, eanNZ, varenr, list};
}
function saveCat(base=false){
  const changed = [];
  for (const k in CAT.items){ const sig = CAT.items[k].updatedAt || ''; if (catUA[k] !== sig){ changed.push(CAT.items[k]); catUA[k] = sig; } }
  buildIdx();
  if (base && !STAFF) catDirty = true;
  const meta = CAT.meta, syc = {sha:SYC.sha, dirty:catDirty};
  STORE.chain = STORE.chain.then(() => STORE.saveCat(changed, meta, syc)).then(() => STORE.okSave()).catch(storageFail);
  if (base && !STAFF) scheduleSync();
}
function catKey(it){ return it.varenr ? 'V'+String(it.varenr).trim() : (it.ean && it.ean[0] ? 'E'+it.ean[0] : 'M'+uid()); }
function lookupCode(code){
  const c = String(code || '').trim().replace(/\s+/g, '');
  if (!c) return null;
  return IDX.ean.get(c) || (/^\d+$/.test(c) ? IDX.eanNZ.get(c.replace(/^0+/, '')) : null) || IDX.varenr.get(c) || IDX.varenr.get(c.replace(/^0+/, '')) || null;
}
function searchCat(q, max=8){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const out = [];
  for (const it of IDX.list){ if (toks.every(t => it._s.includes(t))){ out.push(it); if (out.length >= max) break; } }
  return out;
}
function mergeCat(a, b){ return {v:1, items:mergeMap(a.items, b.items), meta:newer(a.meta, b.meta)}; }

function utf8ToB64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64ToUtf8(b64){ const bin = atob(b64.replace(/\s/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
async function ghFetch(url, opt={}){
  /* unik adresse på GET, så ingen mellomlager (t.d. service worker frå den gamle appen) gjev gamle svar */

        }catch(e){ lastErr = e; }
      }
      throw lastErr || new Error('wasm');
    }catch(e){ /* prøv ZXing-js */ }
    if (!window.ZXing) await loadScript(ZXING_URLS);
    const F = ZXing.BarcodeFormat, hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.CODE_128, F.UPC_A, F.UPC_E, F.CODE_39, F.ITF]);
    const reader = new ZXing.MultiFormatReader(); reader.setHints(hints);
    this.engine = 'zxing-js';
    return { async detect(canvas){
      try{ const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(canvas)));
        const r = reader.decodeWithState(bmp); return r ? [{rawValue:r.getText()}] : []; }
      catch(e){ return []; }
      finally{ try{ reader.reset(); }catch(e){} }
    }};
  },
  preload(){ try{ this.getDetector().catch(() => {}); }catch(e){} },
  async open(cb, manualSel){
    this.cb = cb; this.manual = manualSel || null; this.active = true; const my = ++this.seq;
    $('#scanner').hidden = false; $('#scan-cam').hidden = true; $('#scan-torch').hidden = true;
    this.setTop('Startar kameraet …'); this.setInfo('');
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      this.close(); return this.fail('Kameraet er ikkje tilgjengeleg her. Appen må opnast via https-adressa (GitHub Pages), ikkje som fil.');
    }
    try{
      const [det] = await Promise.all([this.getDetector(), this.startCam()]);
      if (!this.active || my !== this.seq) return;
      this.setTop('Rett kameraet mot strekkoden');
      this.loop(my);
      clearTimeout(this.hintTimer);
      this.hintTimer = setTimeout(() => { if (this.active && my === this.seq) this.setTop('Les han ikkje? Hald telefonen 15–25 cm unna, ha godt lys' + (this.cams.length > 1 ? ', eller trykk «Byt kamera»' : '') + '.'); }, 9000);
    }catch(e){
      if (my !== this.seq) return;
      this.close();
      const n = e && e.name;
      this.fail(n === 'NotAllowedError' || n === 'SecurityError' ? 'Appen fekk ikkje lov til å bruke kameraet. Gje løyve til kameraet for denne nettsida i nettlesaren (på iPhone: Innstillingar → Safari → Kamera) og prøv igjen.'
        : n === 'NotReadableError' || n === 'AbortError' ? 'Kameraet er i bruk av ein annan app. Lukk andre appar som brukar kameraet, og prøv igjen.'
        : n === 'NotFoundError' || n === 'OverconstrainedError' ? 'Fann ikkje noko kamera på denne eininga.'
        : 'Klarte ikkje starte skannaren: ' + ((e && e.message) || e));
    }
  },
  async startCam(deviceId){
    this.stopStream();
    const video = $('#scan-video');
    const saved = deviceId || lsGet(LS_CAM, null);
    const size = {width:{ideal:1920}, height:{ideal:1080}};
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({video: saved ? {deviceId:{exact:saved}, ...size} : {facingMode:{ideal:'environment'}, ...size}, audio:false}); }
    catch(e){
      if (!saved || e.name === 'NotAllowedError') throw e;
      lsSet(LS_CAM, null);
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, ...size}, audio:false});
    }
    if (!this.active){ stream.getTracks().forEach(t => t.stop()); return; }
    this.stream = stream; video.srcObject = stream;
    try{ await video.play(); }catch(e){}
    const tr = stream.getVideoTracks()[0];
    let cap = {};
    try{ cap = tr.getCapabilities ? tr.getCapabilities() : {}; }catch(e){}
    try{ if (cap.focusMode && cap.focusMode.includes('continuous')) await tr.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
    $('#scan-torch').hidden = !cap.torch; this.torchOn = false;
    try{
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const back = devs.filter(d => /back|rear|environment|bak/i.test(d.label));
      this.cams = back.length ? back : devs;
    }catch(e){ this.cams = []; }
    $('#scan-cam').hidden = this.cams.length < 2;
    // Android med fleire kamera: vel hovudkameraet (camera2 0) i staden for vidvinkel som ikkje kan fokusere nært
    const cur = tr.getSettings ? tr.getSettings().deviceId : '';
    if (!saved && /Android/i.test(navigator.userAgent) && this.cams.length > 1){
      const main = this.cams.find(d => /\b0\b.*(back|bak)|camera2 0/i.test(d.label));
      if (main && main.deviceId && main.deviceId !== cur){ lsSet(LS_CAM, main.deviceId); return this.startCam(main.deviceId); }
    }
    const s = tr.getSettings ? tr.getSettings() : {};
    this.curCam = cur;
    this.camInfo = (s.width && s.height ? s.width + '×' + s.height : '') + (tr.label ? ' · ' + tr.label : '');
  },
  async nextCam(){
    if (this.cams.length < 2) return;
    const i = this.cams.findIndex(d => d.deviceId === this.curCam);
    const nx = this.cams[(i + 1) % this.cams.length];
    lsSet(LS_CAM, nx.deviceId);
    this.setTop('Byter kamera …');
    try{ await this.startCam(nx.deviceId); this.setTop('Rett kameraet mot strekkoden'); }
    catch(e){ lsSet(LS_CAM, null); this.setTop('Klarte ikkje byte kamera'); try{ await this.startCam(); }catch(e2){} }
  },
  loop(my){
    const video = $('#scan-video');
    const step = async () => {
      if (!this.active || my !== this.seq) return;
      if (!this.busy && video.readyState >= 2 && video.videoWidth){
        this.busy = true;
        try{
          let src = video;
          if (this.engine !== 'innebygd'){
            const max = this.engine === 'zxing-js' ? 960 : 1280;
            const k = Math.min(1, max / video.videoWidth);
            const c = this.canvas || (this.canvas = document.createElement('canvas'));
            c.width = Math.round(video.videoWidth * k); c.height = Math.round(video.videoHeight * k);
            c.getContext('2d', {willReadFrequently:true}).drawImage(video, 0, 0, c.width, c.height);
            src = c;

          const r = await this.det.detect(src);
          const hit = r && r.find(x => x && x.rawValue && String(x.rawValue).trim());
          if (hit && this.active && my === this.seq){ this.busy = false; return this.found(hit.rawValue); }
        }catch(e){}

    };

  },
  fail(msg){ openModal(`<h2>Kamera</h2><p>${esc(msg)}</p><p class="muted small">Du kan òg bruke ein handskannar (Bluetooth/USB) eller skrive inn strekkoden i søkefeltet.</p><div class="btnrow"><button class="btn primary" data-act="modal-close">OK</button></div>`); },
  found(code){ beep(); try{ navigator.vibrate && navigator.vibrate(70); }catch(e){} const cb = this.cb; this.close(); if (cb) cb(String(code).trim()); },
  stopStream(){ const v = $('#scan-video'); const s = this.stream || (v && v.srcObject); if (s && s.getTracks) s.getTracks().forEach(t => t.stop()); this.stream = null; try{ if (v) v.srcObject = null; }catch(e){} },
  close(){
    this.active = false; this.seq++; clearTimeout(this.timer); clearTimeout(this.hintTimer); this.busy = false;
    this.stopStream();

  },
  skrivInn(){
    const sel = this.manual; this.close();
    const el = (sel && $(sel)) || $('#kode') || $('#f-ean');
    if (el){ el.focus(); try{ el.scrollIntoView({block:'center'}); }catch(e){} }
  },
  async torch(){
    try{ const s = $('#scan-video').srcObject; const tr = s && s.getVideoTracks()[0]; if (!tr) return;
      const cap = tr.getCapabilities ? tr.getCapabilities() : {}; if (!cap.torch){ toast('Lyset kan ikkje styrast på denne eininga'); return; }
      this.torchOn = !this.torchOn; await tr.applyConstraints({advanced:[{torch:this.torchOn}]});
    }catch(e){ toast('Lyset kan ikkje styrast på denne eininga'); }
  }
};

function mapSVG(st, opt={}){
  let hits = '', badges = '';
  Object.keys(HITS).forEach(id => {
    const [x, y, w, h] = HITS[id]; const s = sekById(id); const ss = st[id] || {n:0, state:0};
    const cls = opt.cls ? opt.cls(id) : 'st' + ss.state;
    hits += `<rect class="hit ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4" data-act="${opt.act || 'sek'}" data-id="${id}"><title>${id} ${esc(s ? s.namn : '')}</title></rect>`;
    if (opt.badge){
      const label = opt.badge(id); if (label == null) return;
      let bx, by;
      if (id === 'L01' || id === 'K01' || id === 'L02'){ bx = x + w - 18; by = y + 14; }
      else if (w < 50){ bx = x + w / 2; by = y + 14; }
      else { bx = x + w - 16; by = y + h / 2; }
      badges += `<g class="badge ${cls}"><rect x="${bx - 15}" y="${by - 8.5}" width="30" height="17" rx="8.5" fill="#263238"/><circle cx="${bx}" cy="${by}" r="0"/><text x="${bx}" y="${by + 3.7}" text-anchor="middle">${esc(label)}</text></g>`;
      return;
    }
    if (ss.n || ss.ferdig){
      let bx, by;
      if (id === 'L01' || id === 'K01' || id === 'L02'){ bx = x + w - 14; by = y + 14; }
      else if (w < 50){ bx = x + w / 2; by = y + 12; }
      else { bx = x + w - 11; by = y + h / 2; }
      const label = ss.ferdig ? '✓' : (ss.n > 99 ? '99+' : ss.n);
      badges += `<g class="badge st${ss.state}"><circle cx="${bx}" cy="${by}" r="${String(label).length > 2 ? 12 : 9.5}"/><text x="${bx}" y="${by + 3.7}" text-anchor="middle">${label}</text></g>`;
    }
  });
  return `<svg class="map" viewBox="152 152 626 978" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Butikkart – trykk på ein reol">${MAP_STATIC}${hits}${badges}</svg>`;
}

function draftAntal(d){ return d.modus === 'vekt' ? vektAntal(d.vekt) : parseNum(d.antal); }
function updateCalc(){
  if (!draft) return;
  const d = draft;
  const a = draftAntal(d), p = parseNum(d.pris);
  const vc = $('#f-vcalc');
  if (vc){
    const pa = parseNum(d.vekt.proveAntal), pv = parseNum(d.vekt.proveVekt);
    if (a == null) vc.innerHTML = `<span class="muted small">Fyll inn prøve og totalvekt, så vert talet rekna ut.</span>`;
    else vc.innerHTML = `= <b style="font-size:24px">${qty(a)} ${esc(d.eining)}</b> <span class="small muted">(${nfq.format(round2(pv / pa * 1000) / 1000)} ${esc(d.vekt.unit)} per ${esc(d.eining)})</span>`;
  }
  const s = $('#f-sum'); if (!s) return;
  if (!(a > 0)) { s.innerHTML = `<span style="opacity:.8">Skriv inn mengd</span>`; return; }
  if (STAFF) { s.innerHTML = `= <b>${qty(a)} ${esc(d.eining)}</b>${isNaN(p) && String(d.pris || '').trim() === '' ? ' <span style="opacity:.8;font-size:13px">· utan pris</span>' : ''}`; return; }
  if (isNaN(p)) { s.innerHTML = `${qty(a)} ${esc(d.eining)} – <span style="opacity:.8">manglar pris</span>`; return; }
  const c = lineCalc({antal:a, pris:p, mva:d.mva, innpris:d.innpris, sek:d.sek});
  s.innerHTML = `${qty(a)} ${esc(d.eining)} × ${kr(p)} = <b>${kr(c.inkl)} kr</b> <span style="opacity:.8;font-size:13px">inkl. ${d.mva} % mva</span>`;
}

function handleCode(raw){
  const code = String(raw || '').trim(); if (!code) return;
  const m = /^KRB-([A-Z0-9]+)$/i.exec(code) || (sekById(code.toUpperCase()) && /^[A-Z]\d{2}$/i.test(code) ? [0, code] : null);
  if (m){ const id = m[1].toUpperCase(); if (sekById(id)){ toast('Opnar ' + id + ' ' + sekById(id).namn); go('sek-' + id); return true; } }
  if (route.v !== 'sek'){ toast('Vel seksjon først – skann koden på tellelista eller trykk på kartet', 'err'); return; }
  const it = lookupCode(code);
  const k = $('#kode'); if (k) k.value = '';
  if (it) showForm(newDraft(route.id, {item:it, code}));
  else {
    const hits = /^\d{6,14}$/.test(code) ? [] : searchCat(code, 8);
    if (hits.length === 1) showForm(newDraft(route.id, {item:hits[0]}));
    else if (hits.length) { if (k) k.value = code; renderSugg(code); }
    else { toast(/^\d{6,14}$/.test(code) ? 'Strekkoden finst ikkje i varelista – legg inn vara manuelt' : 'Ny vare'); showForm(newDraft(route.id, {text:code})); }
  }
}
function renderSugg(q){
  const box = $('#forslag'); if (!box) return;
  q = (q || '').trim();
  if (q.length < 2){ box.innerHTML = ''; return; }
  const hits = searchCat(q, 8);
  box.innerHTML = hits.map(it => `<button class="sugg" data-act="velg-vare" data-k="${esc(it.k)}"><span><b>${esc(it.namn)}</b><br><span class="tiny muted">${esc(it.varenr ? 'Varenr. ' + it.varenr : '')} ${esc((it.ean || [])[0] || '')}</span></span><span class="pr">${it.pris != null && it.pris !== '' ? kr(it.pris) : '–'}</span></button>`).join('')
    + `<button class="sugg new" data-act="ny-vare"><span><b>+ Ny vare:</b> «${esc(q)}»</span><span class="pr">Manuelt</span></button>`;
}
function saveDraft(){
  const d = draft; if (!d) return;
  if (locked()) return toast('Teljinga er avslutta', 'err');
  if (!curTellar()) return velTellar(() => saveDraft());
  const namn = (d.namn || '').trim();
  if (!namn) { toast('Skriv inn varenamn', 'err'); const e = $('[data-f=namn]'); if (e) e.focus(); return; }
  const antal = draftAntal(d);
  if (!(antal > 0)) { toast(d.modus === 'vekt' ? 'Fyll inn prøve og totalvekt' : 'Skriv inn mengd', 'err'); const e = $(d.modus === 'vekt' ? '#f-total' : '#f-antal'); if (e) e.focus(); return; }
  const prisRaw = String(d.pris ?? '').trim();
  const pris = prisRaw === '' ? null : parseNum(prisRaw);
  if (pris !== null && (isNaN(pris) || pris < 0)) { toast('Ugyldig pris', 'err'); const e = $('#f-pris'); if (e) e.focus(); return; }
  const now = nowISO();
  const ean = String(d.ean || '').replace(/\s+/g, '');
  let key = d.key;
  if (!d.fromCat && !d.id){
    const it = {k:'', varenr:String(d.varenr || '').trim(), ean:ean ? [ean] : [], namn, pris, innpris:null, mva:+d.mva, eining:d.eining, manuell:true, updatedAt:now, deleted:false};
    it.k = catKey(it);
    if (CAT.items[it.k] && !CAT.items[it.k].deleted){ const ex = CAT.items[it.k]; Object.assign(ex, {namn, mva:+d.mva, eining:d.eining, updatedAt:now}); if (pris !== null) ex.pris = pris; if (ean && !(ex.ean || []).includes(ean)) ex.ean = [...(ex.ean || []), ean]; }
    else CAT.items[it.k] = it;
    key = it.k; saveCat(false);
  }
  if (d.fromCat && key && CAT.items[key] && d.modus === 'vekt'){
    const it = CAT.items[key]; const pr = {proveAntal:d.vekt.proveAntal, proveVekt:d.vekt.proveVekt, unit:d.vekt.unit};
    if (stable(it.prove || {}) !== stable(pr)){ it.prove = pr; it.updatedAt = now; saveCat(false); }
  }
  const old = d.id ? T.linjer[d.id] : null;
  const nySek = d.id && d.flyttSek && d.flyttSek !== d.sek && sekById(d.flyttSek) ? d.flyttSek : d.sek;
  const l = {id:d.id || uid(), sek:nySek, key:key || null, ean, varenr:String(d.varenr || '').trim(), namn, eining:d.eining, mva:+d.mva,
    pris:pris === null ? null : round2(pris), innpris:(parseNum(d.innpris) > 0 ? parseNum(d.innpris) : null), modus:d.modus, antal:antal,
    vekt:d.modus === 'vekt' ? {proveAntal:parseNum(d.vekt.proveAntal), proveVekt:parseNum(d.vekt.proveVekt), total:parseNum(d.vekt.total), tara:parseNum(d.vekt.tara) || 0, unit:d.vekt.unit} : null,
    merknad:(d.merknad || '').trim(), tellar:old ? old.tellar : curTellar(), tid:old ? old.tid : now, updatedAt:now, deleted:false};
  if (old) l.endraAv = curTellar();
  if (old && nySek !== old.sek) l.flyttaFra = old.sek;
  T.linjer[l.id] = l; saveLocal();
  draft = null;
  const fw = $('#formwrap'); if (fw) fw.innerHTML = '';
  $('#sek-live').innerHTML = sekLiveHTML(d.sek); $('#sek-status').innerHTML = sekStatusHTML(d.sek);
  if (nySek !== d.sek) toast(`Flytta til ${nySek}: ${qty(antal)} ${l.eining} ${namn}`, 'ok', {label:'Opne ' + nySek, fn:() => go('sek-' + nySek)});
  else toast(`${old ? 'Endra' : 'Lagra'}: ${qty(antal)} ${l.eining} ${namn}${pris === null ? ' (utan pris)' : ''}`, 'ok');
  const k = $('#kode'); if (k){ k.value = ''; k.focus({preventScroll:true}); }
  $('#addcard') && $('#addcard').scrollIntoView({behavior:'smooth', block:'start'});
}
function deleteLine(id){
  const l = T.linjer[id]; if (!l) return;
  const before = {...l};
  l.deleted = true; l.updatedAt = nowISO(); l.endraAv = curTellar(); saveLocal();
  draft = null; render();
  toast('Linja er sletta', '', {label:'Angre', fn:() => { T.linjer[id] = {...before, updatedAt:nowISO()}; saveLocal(); render(); }});
}

/* ------------------------------ SAMANDRAG / RAPPORT ------------------------------ */
function summary(){
  const sek = allSek(), lines = activeLines();
  const perMva = {}, perSek = {}, perTellar = {}, perOmr = {};
  MVA_SATSAR.forEach(m => perMva[m] = {n:0, inkl:0, mva:0, eks:0, kost:0});
  sek.forEach(s => perSek[s.id] = {n:0, inkl:0, eks:0, kost:0, tellarar:{}});
  const tot = {n:0, inkl:0, mva:0, eks:0, kost:0, kostI:0, kostA:0, utanPris:0, vekt:0, tid0:null, tid1:null};
  const rows = lines.map(l => {
    const c = lineCalc(l);
    const m = perMva[l.mva] || (perMva[l.mva] = {n:0, inkl:0, mva:0, eks:0, kost:0});
    m.n++; m.inkl += c.inkl; m.mva += c.mva; m.eks += c.eks; m.kost += c.kost;
    const s = perSek[l.sek] || (perSek[l.sek] = {n:0, inkl:0, eks:0, kost:0, tellarar:{}});
    s.n++; s.inkl += c.inkl; s.eks += c.eks; s.kost += c.kost; s.tellarar[l.tellar] = (s.tellarar[l.tellar] || 0) + 1;
    perTellar[l.tellar] = (perTellar[l.tellar] || 0) + 1;
    const sk = sekById(l.sek); const o = sk ? sk.omr : 'X'; perOmr[o] = (perOmr[o] || 0) + c.kost;
    tot.n++; tot.inkl += c.inkl; tot.mva += c.mva; tot.eks += c.eks; tot.kost += c.kost;
    if (c.metode === 'I') tot.kostI += c.kost; else tot.kostA += c.kost;
    if (!(parseNum(l.pris) > 0)) tot.utanPris++;
    if (l.modus === 'vekt') tot.vekt++;
    if (!tot.tid0 || l.tid < tot.tid0) tot.tid0 = l.tid;
    if (!tot.tid1 || l.tid > tot.tid1) tot.tid1 = l.tid;
    return {l, c};
  });
  Object.values(perMva).forEach(m => { m.inkl = round2(m.inkl); m.mva = round2(m.mva); m.eks = round2(m.eks); m.kost = round2(m.kost); });
  ['inkl','mva','eks','kost','kostI','kostA'].forEach(k => tot[k] = round2(tot[k]));
  const ukurans = round2(parseNum(T.meta.ukurans) || 0);
  tot.balanse = round2(tot.kost - ukurans); tot.ukurans = ukurans;
  const ikkjeFerdig = sek.filter(s => !(T.status[s.id] && T.status[s.id].ferdig));
  const tomme = sek.filter(s => !perSek[s.id].n);
  return {sek, rows, perMva, perSek, perTellar, perOmr, tot, ikkjeFerdig, tomme};
}
async function kontrollsum(S){
  const txt = S.rows.map(({l}) => [l.id, l.sek, l.namn, l.antal, l.pris, l.mva, l.eining].join('|')).join('\n');
  try{ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return Array.from(new Uint8Array(buf)).slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase(); }
  catch(e){ let h = 0x811c9dc5; for (let i = 0; i < txt.length; i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).toUpperCase().padStart(8, '0'); }
}

  if (D.length) h += `<div class="card"><h2>Mogleg dobbelttelling (${dOpen.length} å sjekke)</h2><p class="small muted" style="margin-top:0">Same vare er talt meir enn éin gong – på fleire stader eller fleire linjer i same seksjon. Det kan vere rett (t.d. både i hylla og på lageret). Sjekk og merk «Rett».</p>

function avslutt(){
  if (!curTellar()) return velTellar(avslutt);
  const S = summary();
  const w = [];
  const dOpen = dobbelGroups().filter(g => !g.ok).length;
  if (dOpen) w.push(`<b>${dOpen} varer kan vere talde to gonger</b> og er ikkje kontrollerte.`);
  if (ghOn() && PEND.size) w.push(`<b>${PEND.size} linjer på denne eininga er ikkje delte enno.</b>`);
  if (S.ikkjeFerdig.length) w.push(`<b>${S.ikkjeFerdig.length} seksjonar er ikkje merka ferdige</b> (${S.ikkjeFerdig.map(s => s.id).join(', ')}).`);
  if (S.tot.utanPris) w.push(`<b>${S.tot.utanPris} linjer manglar pris</b> og vert verdsette til 0 kr.`);
  confirmBox('Avslutte varetellinga?', `${w.join('<br>')}${w.length ? '<br><br>' : ''}Sum: <b>${kr(S.tot.inkl)} kr</b> inkl. mva, kostverdi <b>${kr(S.tot.kost)} kr</b>, ${S.tot.n} linjer.<br>Linjene vert låste. Avslutta av: <b>${esc(curTellar())}</b>.`, 'Avslutt', () => {
    T.avslutta = {status:true, av:curTellar(), tid:nowISO(), updatedAt:nowISO()}; saveLocal(); render(); toast('Varetellinga er avslutta', 'ok');
  });
}

let IMP = null;
function parseCSV(text){
  const first = text.split(/\r?\n/).slice(0, 5).join('\n');
  const cands = [';', '\t', ',', '|']; let sep = ';', best = -1;
  cands.forEach(c => { const n = first.split(c).length; if (n > best){ best = n; sep = c; } });
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

}
async function readFile(file){

}

}

async function analyseExcel(){

  const A = analyse(); if (!A) return;
  const a1 = [['Reol', 'Seksjon', 'Lagerverdi kost', 'Lagerverdi utsal eks. mva', 'Sal/år eks. mva (varer)', 'Sal/år eks. mva (generelle knappar)', 'Sal/år eks. mva totalt', 'Dagar på lager', 'Dekning %', 'Linjer utan sal', 'Kost utan sal']];
  allSek().forEach(s => { const p = A.per[s.id]; if (!p || !(p.uts > 0)) return; a1.push([s.id, s.namn, round2(p.kost), round2(p.uts), round2(p.salDir), round2(p.salGen), round2(p.sal), p.dagar === Infinity ? 'Ingen sal' : Math.round(p.dagar), Math.round(p.dekning * 100), p.utanSal, round2(p.utanSalKost)]); });
  const a2 = [['Vare', 'Varenr', 'Reolar', 'Mengd', 'Eining', 'Lagerverdi kost', 'Sal/år eks. mva', 'Dagar på lager']];
  A.varer.sort((x, y) => y.kost - x.kost).forEach(v => a2.push([v.namn, v.varenr || '', [...v.sek].join(', '), round2(v.antal * 1000) / 1000, v.eining, round2(v.kost), v.kjent ? round2(v.salEks) : 'ukjent', v.dagar == null ? 'ukjent' : (v.dagar === Infinity ? 'Ingen sal' : Math.round(v.dagar))]));
  const wb = XLSX.utils.book_new();
  const w1 = XLSX.utils.aoa_to_sheet(a1); w1['!cols'] = [{wch:6},{wch:30},{wch:14},{wch:14},{wch:14},{wch:16},{wch:14},{wch:12},{wch:10},{wch:10},{wch:12}];
  const w2 = XLSX.utils.aoa_to_sheet(a2); w2['!cols'] = [{wch:40},{wch:10},{wch:14},{wch:9},{wch:7},{wch:14},{wch:14},{wch:12}];
  XLSX.utils.book_append_sheet(wb, w1, 'Per reol'); XLSX.utils.book_append_sheet(wb, w2, 'Per vare');

function appBase(){ return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, ''); }
function staffUrl(){ return STAFF ? appBase() : appBase() + 'tilsett/'; }
function kopleLenke(){
  const g = ghCfg();
  const b64 = utf8ToB64(JSON.stringify({t:getToken(), o:g.owner, r:g.repo, b:g.branch, d:g.dir, id:T.id})).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
  return staffUrl() + '#kople=' + b64;
}
function handleKople(){
  const m = /^#kople=([A-Za-z0-9_\-+/=]+)/.exec(location.hash || '');
  if (!m) return null;
  try{
    const p = JSON.parse(b64ToUtf8(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    if (p.t) setToken(p.t);
    lsSet(LS.gh, {owner:p.o || GH_DEF.owner, repo:p.r || GH_DEF.repo, branch:p.b || 'main', dir:p.d || 'data'});
    if (p.id) lsSet(LS.active, String(p.id));
    history.replaceState(null, '', location.pathname + location.search);
    return 'ok';
  }catch(e){ history.replaceState(null, '', location.pathname + location.search); return 'feil'; }
}

<h3>Same vare fleire stader</h3><p>Er vara alt talt, viser appen «⚠ Alt talt:» med reol, mengd, kven og klokkeslett. Det er rett når vara står fleire stader. Pass på at du ikkje tel dei same varene to gonger.</p>
<h3>Endre, flytte eller slette ei linje</h3><p>Trykk ✎ på linja.</p><ul>
<li><b>Endre:</b> rett mengd, pris eller mva-sats, og trykk <b>Lagre endring</b>.</li>
<li><b>Flytte:</b> vel ein annan seksjon under «Seksjon – vel ein annan for å flytte linja», og lagre.</li>
<li><b>Slette:</b> trykk <b>Slett linja</b>. Ved ein feil trykkjer du <b>Angre</b> i meldinga nedst.</li></ul>
<h3>Ferdig med seksjonen</h3><p>Trykk <b>✓ Ferdig med …</b> (koden for seksjonen du står i). Seksjonen blir grøn på kartet, og appen sender linjene med ein gong. Skal du leggje til meir etterpå, trykk <b>Opne att for å legge til</b>.</p>`,
'hj-trygg':`<h2>Tryggleik og deling</h2>
<p>Kvar linje blir lagra på telefonen med ein gong du trykkjer Lagre, og blir sendt til GitHub innan eit minutt når det er nett. Linjer som ventar, går ikkje tapt om appen blir lukka. Dei blir sende neste gong appen er open med nett.</p>
<div class="tablewrap"><table class="t"><thead><tr><th>Merke øvst</th><th>Kva det tyder</th><th>Kva du gjer</th></tr></thead><tbody>
<tr><td><span class="hj-pill ok">✓ Alt delt 14:32</span></td><td>Alt er trygt i GitHub</td><td>Ingenting</td></tr>
<tr><td><span class="hj-pill busy">⏳ 3 ventar</span></td><td>Lagra på telefonen, blir sendt innan eit minutt</td><td>Tel vidare</td></tr>
<tr><td><span class="hj-pill busy">↻ Delar</span></td><td>Appen sender eller hentar no</td><td>Tel vidare</td></tr>
<tr><td><span class="hj-pill feil">⚠ 3 ikkje delt</span></td><td>Ikkje kontakt med GitHub, som regel utan nett</td><td>Tel vidare. Sjekk nettet. Ikkje slett appen</td></tr>
<tr><td><span class="hj-pill feil">⏸ 3 ventar</span></td><td>GitHub ber appen vente litt</td><td>Tel vidare. Går av seg sjølv</td></tr>
<tr><td><span class="hj-pill av">● Lokalt</span></td><td>Telefonen er ikkje kopla til</td><td>Kople til med QR-koden</td></tr>
<tr><td><span class="hj-pill feil">⚠ Lagringsfeil</span></td><td>Telefonen klarte ikkje lagre</td><td>Ikkje lukk appen. Last ned sikkerheitskopi og si frå</td></tr></tbody></table></div>
<p>Ei linje med ⏳ før namnet er ikkje delt enno. Trykk på merket øvst for detaljar og knappen <b>Del no</b>.</p>
<h3>Utan nett</h3><p>Tel som vanleg. Appen hugsar kva som ikkje er sendt, òg om telefonen blir slått av. Når nettet kjem tilbake, sender han alt.</p>
<h3>Gode vanar</h3><ul>
<li>Legg appen til på heimeskjermen. Det gjev betre vern mot at nettlesaren ryddar vekk data, særleg på iPhone.</li>
<li>Ikkje bruk privat modus, og ikkje tøm historikk eller nettlesardata medan teljinga pågår.</li>
<li>Sjå at det står «✓ Alt delt» før du gjev frå deg telefonen eller går heim.</li></ul>
<h3>Lokale kopiar</h3><p>Appen tek ein kopi av teljinga på telefonen kvart 15. minutt og tek vare på dei 12 siste. Er linjer sletta ved ein feil: gå til <b>Oppsett → Tryggleik → Lokale kopiar …</b> og trykk <b>Hent tilbake</b> på ein kopi frå før feilen. Appen legg til att linjer som manglar eller er sletta. Ingenting blir fjerna.</p>
<h3>Sikkerheitskopi til fil</h3><p><b>Oppsett → Last ned</b> lagrar teljinga som ei fil.${STAFF ? ' Send fila til den som styrer teljinga om telefonen ikkje kan koplast til.' : ' På ein annan eining kan fila hentast inn med <b>Slå saman frå fil</b>, som legg linjene til utan å slette noko.'}</p>
${STAFF ? '' : '<h3>Kvar tala ligg</h3><p>I repoet ligg teljinga i mappa <i>data/telling-&lt;kode&gt;/</i>, med éi fil per seksjon per telefon. Kvar telefon skriv berre sine eigne filer, så ingen kan skrive over kvarandre. GitHub tek vare på kvar versjon under History.</p>'}`,
'hj-etter':`<h2>Etter teljinga (administrator)</h2>
<p>Når alle reolane er grøne, sjekkar du tre lister under <b>Rapport</b>. Deretter avsluttar du teljinga og sender PDF-rapporten og Excel-fila til rekneskapsføraren.</p><ol>
<li><b>Sjå at alle telefonane har delt.</b> «Telefonar som har delt» viser kven som har levert og når. Ein telefon som ikkje har vore på nett, har tala sine berre på telefonen.</li>
<li><b>Fyll inn prisar som manglar.</b> Skriv utsalspris inkl. mva og trykk <b>Lagre</b>. Vara i varelista får same pris.</li>
<li><b>Sjekk mogleg dobbelttelling.</b> Trykk <b>✓ Rett</b> når det stemmer. Er det ein feil, opnar du seksjonen og rettar eller slettar linja.</li>
<li><b>Sjå over tala.</b> Kostverdien er utsalsverdi eks. mva × (1 − avanse). Varer med innkjøpspris frå PCK får mengd × innkjøpspris. Nedskriving for ukurans legg du inn under Oppsett.</li>
<li><b>Avslutt teljinga.</b> Trykk <b>✓ Avslutt varetellinga</b>. Linjene blir låste, og rapporten får dato og namnet ditt. Må noko rettast, trykk <b>Opne att</b>.</li>
<li><b>Lag rapporten til revisor.</b> Trykk <b>🖨 Rapport til revisor (PDF/utskrift)</b>, så <b>🖨 Skriv ut / PDF</b>, og vel «Lagre som PDF».</li>
<li><b>Last ned Excel til rekneskapen.</b> Trykk <b>⬇ Excel til rekneskap</b>.</li>
<li><b>Ta vare på ein sikkerheitskopi.</b> Trykk <b>⬇ Sikkerheitskopi (JSON)</b> og lagre fila saman med PDF-en.</li>
<li><b>Signer.</b> Skriv ut forsida og la tellarane, den som har kontrollert og dagleg leiar signere.</li></ol>
<h3>Kva rapporten inneheld</h3><p>Rapporten er laga etter krava i bokføringsforskrifta § 6-1: varens art, mengd med måleeining og verdi for kvar vare, datert og med kven som har talt. Før teljinga er avslutta, er kvar side merkt «UTKAST».</p>
<div class="tablewrap"><table class="t"><thead><tr><th>Del</th><th>Innhald</th></tr></thead><tbody>
<tr><td><b>Forside</b></td><td>Tellingsinformasjon, samandrag per mva-sats, verdsetjing, varebeholdning til balansen, kontroll av dobbelttelling, kontrollsum og signaturfelt</td></tr>
<tr><td><b>Samandrag per telleliste</b></td><td>Éi rad per seksjon med linjer, verdi, tellarar og når han vart ferdig</td></tr>
<tr><td><b>Tellelister</b></td><td>Éi side per seksjon med strekkode, alle varelinjer, utrekninga for veging og sum per mva-sats</td></tr>
<tr><td><b>Excel-fila</b></td><td>Ark for samandrag, per telleliste, alle varelinjer (med filter) og per vare</td></tr></tbody></table></div>`,
'hj-analyse':`<h2>Analyse: lagerverdi mot sal per reol</h2>
<p>Analyse-fanen viser kor mykje pengar som står på kvar reol, og kor mange dagar lageret rekk med dagens sal. Tala er rette først når heile butikken er talt.</p>
<h3>Hent inn salstal</h3><ol>
<li>Eksporter sal per vare frå min.pckasse.no til Excel eller CSV, helst for dei siste 12 månadene, med varenummer, namn og sum beløp.</li>
<li>Gå til <b>Analyse → 📥 Importer salstal</b> og vel fila.</li>
<li>Sjekk kor mange månader fila dekkjer.</li>
<li>Kryss av for «Fila har alle varer» berre om fila er komplett. Er ho ei toppliste, blir varer som manglar rekna som ukjent sal.</li></ol>
<p class="small muted">Salstala blir lagra berre på eininga du importerer dei på, ikkje i GitHub.</p>
<h3>Les kartet</h3><p>Grøn: 60 dagar eller mindre · gul: 61–180 · oransje: 181–365 · raud: over eitt år · skravert: for lite salsdata (under 60 % av lagerverdien har salstal).</p>
<ul><li><b>Per reol – tregast først</b> viser lagerverdi, sal per år og dagar på lager.</li>
<li><b>Mest pengar i varer som sel lite</b> viser varer med meir enn eitt års lager, som kan seljast ned, sendast i retur eller skrivast ned.</li>
<li><b>⬇ Analysen til Excel</b> lagar ei fil med tala per reol og per vare.</li></ul>
<h3>Generelle kasseknappar</h3><p>Sal på knappar som «Jernvarer» og «Maling» blir fordelt på reolane du vel, etter lagerverdien deira. Trykk på ein knapp i lista og <b>Endre</b>. <b>Standard</b> set tilbake: Jernvarer → J04–J07 og J10–J13 · Maling → J01, J02 · Batteri → B08 · Fiskeutstyr → J08, J09 · Båtutstyr → J03, J08, J09 · Bil Rekv → J07 · Olje → J12 · Tobakk → B11 · Kolon → B05. Kiosk 15 % er ikkje fordelt.</p>`,
'hj-feil':`<h2>Feilsøking og vanlege spørsmål</h2>
<p>Dei fleste problema løyser seg ved å telje vidare og sjekke merket øvst. Ingenting du har lagra, forsvinn av å lukke appen.</p>
<div class="tablewrap"><table class="t"><thead><tr><th>Problem</th><th>Løysing</th></tr></thead><tbody>
<tr><td><b>Kameraet startar ikkje</b></td><td>Gje appen løyve til kameraet i nettlesaren (iPhone: Innstillingar → Safari → Kamera). Lukk andre appar som brukar kameraet. Bruk elles handskannar eller skriv strekkoden i søkefeltet.</td></tr>
<tr><td><b>Kameraet les ikkje strekkoden</b></td><td>Hald telefonen 15–25 cm unna i godt lys, og hald strekkoden vassrett i ramma. Prøv «Byt kamera» – nokre telefonar startar med vidvinkelkameraet, som ikkje kan fokusere nært. Appen hugsar kameraet du vel.</td></tr>
<tr><td><b>Strekkoden blir ikkje funnen</b></td><td>Vara manglar i varelista. Legg henne inn som ny vare, så blir ho funnen neste gong.</td></tr>
<tr><td><b>Prisen er feil</b></td><td>Rett prisen i skjemaet før du lagrar. Det gjeld berre den linja.${STAFF ? '' : ' Rett prisen i varelista under Varer.'}</td></tr>
<tr><td><b>«⚠ ikkje delt» lenge</b></td><td>Sjekk nettet, trykk på merket og <b>Del no</b>. Tel vidare: linjene ligg trygt på telefonen.</td></tr>
<tr><td><b>Ser ikkje det andre har talt</b></td><td>Appen hentar nytt kvart 45. sekund. Vent litt, eller trykk på merket og <b>Del no</b>.</td></tr>
<tr><td><b>Talde i feil seksjon</b></td><td>Trykk ✎ på linja, vel rett seksjon og trykk <b>Lagre endring</b>.</td></tr>
<tr><td><b>Sletta ei linje ved ein feil</b></td><td>Trykk <b>Angre</b> i meldinga, eller gå til Oppsett → Lokale kopiar og <b>Hent tilbake</b>.</td></tr>
<tr><td><b>Seksjonen er ferdig, men noko manglar</b></td><td>Opne seksjonen og trykk <b>Opne att for å legge til</b>.</td></tr>
<tr><td><b>Teljinga er avslutta, men noko må rettast</b></td><td>${STAFF ? 'Si frå til den som styrer teljinga.' : 'Trykk <b>Opne att</b> under Rapport, rett og avslutt på nytt.'}</td></tr>
<tr><td><b>Ny telefon midt i teljinga</b></td><td>Skann QR-koden «Kople til telefon». Alt som er talt blir henta frå GitHub.</td></tr>
<tr><td><b>Ein telefon blir borte eller går i stykke</b></td><td>Alt han har delt, ligg i GitHub. Berre linjer som ikkje var delte, er borte.</td></tr>
<tr><td><b>«⚠ Lagringsfeil»</b></td><td>Ikkje lukk appen. Sjekk at du ikkje er i privat modus, last ned sikkerheitskopi under Oppsett, og si frå.</td></tr>
<tr><td><b>«● Lokalt»</b></td><td>Telefonen er ikkje kopla til. Skann QR-koden «Kople til telefon».</td></tr></tbody></table></div>`
  };
  return S[id] || '';
}

async function koplePlakat(){
  if (STAFF) return;
  if (!getToken()) return toast('Slå på deling først', 'err');
  try{ await loadScript(QR_URLS); }catch(e){ return toast(e.message, 'err'); }
  const qr = qrcode(0, 'M'); qr.addData(kopleLenke()); qr.make();
  const svg = qr.createSvgTag({cellSize:4, margin:0, scalable:true});
  closeModal();
  showPreview('Plakatar for tilsette – med kople-kode', plakatHTML(svg));
}

function saveOppsett(){
  const M = T.meta;
  const av = parseNum($('#o-avanse').value); if (isNaN(av) || av < 0 || av >= 100) return toast('Avansen må vere mellom 0 og 99 %', 'err');

  Object.assign(M, {namn:$('#o-namn').value.trim() || M.namn, perDato:$('#o-per').value || M.perDato, firma:$('#o-firma').value.trim(), orgnr:$('#o-orgnr').value.trim(), stad:$('#o-stad').value.trim(), avanse:av, avanseOmr:avo, ukurans:parseNum($('#o-ukurans').value) || 0, ukuransTekst:$('#o-ukt').value.trim(), updatedAt:nowISO()});

/* ------------------------------ JSON ------------------------------ */
function jsonUt(){
  const data = {app:'krambua-varetelling', ver:APP_VER, eksportert:nowISO(), telling:T, vareliste:CAT};
  download(`Varetelling_${T.id}_${todayISO()}.json`, new Blob([JSON.stringify(data)], {type:'application/json'}));
}
async function jsonInn(file){
  try{
    const d = JSON.parse(await file.text());
    const t = d.telling || d;
    if (!t.linjer) throw new Error('Fila er ikkje ein varetellings-kopi');
    if (String(t.id) !== T.id) return confirmBox('Anna telling', `Fila gjeld telling «${esc(t.id)}», men du har opna «${esc(T.id)}». Slå saman likevel?`, 'Slå saman', () => doMerge(t, d.vareliste));
    doMerge(t, d.vareliste);
  }catch(e){ toast('Klarte ikkje lese fila: ' + e.message, 'err'); }
}
function doMerge(t, cat){
  const before = activeLines().length;
  t = {...t, id:T.id};
  T = mergeTelling(T, t); saveLocal();
  if (cat && cat.items){ CAT = mergeCat(CAT, cat); saveCat(true); }
  render(); toast(`Slått saman: ${activeLines().length - before} nye linjer`, 'ok');
}
