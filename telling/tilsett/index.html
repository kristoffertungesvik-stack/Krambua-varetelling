<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263238">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Krambua Varetelling – tilsette</title>
<style>
:root{--slate:#263238;--reol:#37525A;--ochre:#C98A1A;--kjol:#7FB3C8;--red:#C8102E;--cream:#F6EFE0;--jv:#E6ECEF;--bg:#F2F0EB;--card:#fff;--line:#DCD8CE;--muted:#5D6B70;--ok:#2E8B47;--okbg:#E3F2E7;--warn:#C27700;--warnbg:#FFF2D9;--err:#B3261E;--errbg:#FCE8E6;--txt:#1E2A30;--focus:#2B6CB0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--focus)}
#topbar{position:sticky;top:0;z-index:30;background:var(--slate);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 9px;display:flex;align-items:center;gap:10px}
#topbar .ttl{flex:1;min-width:0}
#topbar .ttl b{display:block;font-size:13.5px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .ttl span{display:block;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 11px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pill-btn.need{background:#F2B33D;color:#1E2A30;border-color:#F2B33D;font-weight:600}
#sync{font-size:12px;border-radius:999px;padding:4px 9px;cursor:pointer;border:0;white-space:nowrap}
#sync.av{background:rgba(255,255,255,.12);color:#cfd8dc}
#sync.ok{background:#2E8B47;color:#fff}
#sync.busy{background:#3d5560;color:#fff}
#sync.feil{background:#F2B33D;color:#1E2A30}
main{padding:12px 12px 96px;max-width:860px;margin:0 auto}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav button[hidden]{display:none}
#nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--slate);font-weight:700}
#nav button.on svg{stroke:var(--ochre)}
h1{font-size:21px;margin:4px 0 10px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 15px;border-radius:10px;border:1px solid #C9C4B8;background:#fff;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--txt)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--slate);color:#fff;border-color:var(--slate)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ochre{background:var(--ochre);color:#fff;border-color:var(--ochre)}
.btn.danger{color:var(--err);border-color:#E3B5B1}
.btn.ghost{border-color:transparent;background:transparent}
.btn.big{min-height:54px;font-size:17px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btnrow .btn{flex:1 1 auto}
label{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin:10px 0 0}
label input,label select,label textarea{display:block;width:100%;margin-top:4px}
input[type=text],input:not([type]),input[type=password],input[type=date],input[type=number],select,textarea{border:1px solid #C9C4B8;border-radius:9px;padding:10px 11px;background:#fff;min-height:44px;font-size:16px;color:var(--txt);font-weight:500}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(43,108,176,.35);outline-offset:1px;border-color:var(--focus)}
label.check{display:flex;gap:9px;align-items:center;color:var(--txt);font-weight:500;font-size:15px}
label.check input{width:22px;height:22px;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lbl{font-size:13.5px;color:var(--muted);font-weight:600;margin:12px 0 5px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1.5px solid #C9C4B8;background:#fff;border-radius:999px;padding:8px 15px;font-weight:700;cursor:pointer;min-height:42px;font-size:15px}
.chip.on{background:var(--slate);color:#fff;border-color:var(--slate)}
.seg{display:flex;border:1.5px solid #C9C4B8;border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:10px 6px;font-weight:600;cursor:pointer;min-height:44px;font-size:14.5px}
.seg button+button{border-left:1.5px solid #C9C4B8}
.seg button.on{background:var(--ochre);color:#fff}
.seg.small button{padding:6px;min-height:36px;font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:#ECEAE4;color:var(--muted);vertical-align:middle}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.err{background:var(--errbg);color:var(--err)}
.tag.st1{background:var(--warnbg);color:var(--warn)}
.tag.st2{background:var(--okbg);color:var(--ok)}
.banner{border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:14.5px;border:1px solid}
.banner.warn{background:var(--warnbg);border-color:#F0D49B}
.banner.ok{background:var(--okbg);border-color:#B7DDC2}
.banner.info{background:#EAF1F7;border-color:#C5D7E8}
.banner.err{background:var(--errbg);border-color:#F1C3BF}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px}
.stat b{display:block;font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#E4E0D6;border-radius:99px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px}
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;margin-bottom:12px;overflow:auto;-webkit-overflow-scrolling:touch}
.mapwrap.zoom svg{width:165%;max-width:none}
svg.map{display:block;width:100%;height:auto;max-width:640px;margin:0 auto;user-select:none;-webkit-user-select:none}
.map .ml{font-size:12.5px;font-weight:600;fill:#22313A}
.map .ml.w{fill:#fff}
.map .sm{font-size:11px;font-weight:500}
.map .rl{font-size:17px;font-weight:700;fill:#22313A}
.map .area{font-size:13px;letter-spacing:3px;font-weight:700;fill:#6B7A80}
.map .hit{fill:transparent;cursor:pointer;pointer-events:all;stroke:transparent;stroke-width:2;rx:4}
.map .hit:hover{fill:rgba(38,50,56,.07);stroke:rgba(38,50,56,.35)}
.map .hit.st1{fill:rgba(242,170,30,.30);stroke:#D98A00}
.map .hit.st2{fill:rgba(46,139,71,.30);stroke:#2E8B47}
.map .hit.h0{fill:url(#hatch);stroke:#8A9599}
.map .hit.h1{fill:rgba(46,139,71,.40);stroke:#2E8B47}
.map .hit.h2{fill:rgba(235,195,30,.50);stroke:#B89400}
.map .hit.h3{fill:rgba(240,135,25,.50);stroke:#C9650A}
.map .hit.h4{fill:rgba(200,30,40,.45);stroke:#B3261E}
.map .badge.h0 rect{fill:#6B7A80}.map .badge.h1 rect{fill:#2E8B47}.map .badge.h2 rect{fill:#8C7100}.map .badge.h3 rect{fill:#B85A08}.map .badge.h4 rect{fill:#B3261E}
.dupg{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:8px;background:#FFFCF5}
.dupg.ok{background:#F6FBF7;border-color:#CFE6D6}
.dupg .row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qr svg{display:block;width:100%;max-width:320px;height:auto;margin:0 auto}
.heat-leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.map .badge{pointer-events:none}
.map .badge circle{fill:#263238}
.map .badge.st2 circle{fill:#2E8B47}
.map .badge.st1 circle{fill:#C27700}
.map .badge text{fill:#fff;font-size:10.5px;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 4px 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1.5px solid}
.seklist{display:flex;flex-direction:column;gap:6px}
.sekrow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.sekrow .code{font-weight:800;font-size:13px;background:#ECEAE4;border-radius:6px;padding:3px 6px;min-width:40px;text-align:center}
.sekrow.st1 .code{background:var(--warnbg);color:var(--warn)}
.sekrow.st2 .code{background:var(--okbg);color:var(--ok)}
.sekrow .nm{flex:1;min-width:0}
.sekrow .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sekrow .nm span{font-size:12.5px;color:var(--muted)}
.sekrow .rt{text-align:right;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.grp-h{font-size:12.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px}
.sek-head{display:flex;gap:12px;align-items:flex-start}
.sek-head .code{font-weight:800;font-size:20px;background:var(--slate);color:#fff;border-radius:9px;padding:6px 10px}
.search{display:flex;gap:8px;position:relative}
.search input{flex:1;min-width:0}
#forslag{margin-top:6px;display:flex;flex-direction:column;gap:5px}
.sugg{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#FBFAF7;border-radius:9px;padding:9px 11px;cursor:pointer;text-align:left;width:100%}
.sugg b{font-weight:600}
.sugg .pr{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.sugg.new{background:var(--warnbg);border-color:#F0D49B}
.form{border:2px solid var(--ochre);border-radius:12px;padding:12px 13px;margin-top:12px;background:#FFFCF5}
.vare-namn{font-size:18px;font-weight:700;line-height:1.25}
.vare-meta{font-size:13px;color:var(--muted);margin-top:3px}
.antal-row{display:grid;grid-template-columns:62px minmax(0,1fr) 62px;gap:8px;margin-top:12px}
.antal-row input{text-align:center;font-size:26px;font-weight:700;min-height:58px;min-width:0;width:100%}
.search input{min-width:0}
.row2>label,.row3>label{min-width:0}
table.t td:first-child{white-space:nowrap}
.antal-row .btn{font-size:26px;min-height:58px;padding:0}
.calc{margin-top:10px;background:#fff;border:1px dashed #C9C4B8;border-radius:9px;padding:9px 11px;font-size:14.5px}
.calc b{font-size:22px}
.sumline{margin-top:12px;font-size:15px;background:var(--slate);color:#fff;border-radius:9px;padding:10px 12px;font-variant-numeric:tabular-nums}
.sumline b{font-size:18px}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.line .nr{font-size:12px;font-weight:700;color:var(--muted);min-width:26px}
.line .mid{flex:1;min-width:0}
.line .mid b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .mid span{font-size:12.5px;color:var(--muted)}
.line .sum{text-align:right;font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.line .sum span{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.line button{border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:40px;cursor:pointer;font-size:17px}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid #ECE8DF;text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr.sum td{font-weight:800;border-top:2px solid var(--slate);border-bottom:0}
.tablewrap{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1E2A30;color:#fff;padding:11px 16px;border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast.err{background:var(--err)}
#toast.ok{background:var(--ok)}
#toast button{background:none;border:0;color:#FFD36E;font-weight:700;margin-left:10px;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,32,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.modal h2{margin-bottom:6px}
.namelist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.namelist .btn{justify-content:flex-start;text-align:left}
.namelist .btn.on{background:var(--slate);color:#fff}
#scanner{position:fixed;inset:0;background:#000;z-index:95}
#scanner[hidden]{display:none}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scanner .frame{position:absolute;left:8%;right:8%;top:32%;height:28%;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
#scanner .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF4D4D;box-shadow:0 0 8px #FF4D4D}
#scanner .top{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:0;right:0;text-align:center;color:#fff;font-weight:600;font-size:16px;text-shadow:0 1px 4px #000}
#scanner .bot{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:0;right:0;display:flex;justify-content:center;gap:12px}
#scanner .bot .btn{min-width:120px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.drop{border:2px dashed #C9C4B8;border-radius:12px;padding:18px;text-align:center;background:#FBFAF7}
.itemrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid #ECE8DF;padding:8px 2px;cursor:pointer}
.itemrow:last-child{border-bottom:0}
.itemrow .mid{flex:1;min-width:0}
.itemrow b{display:block;font-weight:600;font-size:14.5px}
.itemrow span{font-size:12.5px;color:var(--muted)}
.hide{display:none!important}
details summary{cursor:pointer;font-weight:700}
/* ---------- utskrift ---------- */
#print-root{display:none}
body.preview #print-root{display:block;position:fixed;inset:0;overflow:auto;background:#7d878b;z-index:100;-webkit-overflow-scrolling:touch}
body.preview #app,body.preview #nav{display:none}
.pv-bar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--slate);color:#fff}
.pv-bar b{flex:1;font-size:14px}
.pv-bar .btn{min-height:40px;padding:6px 13px}
.doc{font-family:"Helvetica Neue",Arial,system-ui,sans-serif;color:#111;font-size:9.5pt;line-height:1.35}
.page{background:#fff;width:210mm;max-width:calc(100vw - 16px);min-height:200mm;margin:10px auto;padding:13mm 12mm;box-shadow:0 2px 10px rgba(0,0,0,.3);position:relative;overflow:hidden}
.doc h1{font-size:17pt;margin:2mm 0 1mm;letter-spacing:.2px}
.doc h2{font-size:11pt;margin:4mm 0 1.5mm;padding-bottom:1mm;border-bottom:1.5px solid #263238}
.doc .firm{font-size:8.5pt;letter-spacing:1.6px;font-weight:700;color:#37474F;text-transform:uppercase}
.doc .sub{color:#444;font-size:9.5pt}
.doc table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.doc th,.doc td{border-bottom:.6pt solid #BFC5C7;padding:1.3mm 1.4mm;text-align:left;vertical-align:top}
.doc th{background:#ECEFF0;font-size:7.6pt;text-transform:uppercase;letter-spacing:.3px;border-bottom:.9pt solid #263238}
.doc thead{display:table-header-group}
.doc tr{break-inside:avoid}
.doc td.n,.doc th.n{text-align:right;white-space:nowrap}
.doc td.c,.doc th.c{text-align:center;white-space:nowrap}
.doc tr.sum td{font-weight:700;border-top:1.2pt solid #263238;border-bottom:1.2pt solid #263238;background:#F6F7F7}
.doc tr.sub td{background:#FAFAFA;font-weight:600}
.doc .info td{border:0;padding:.45mm 2mm .45mm 0}
.doc .info td:first-child{color:#555;width:46mm}
.doc .box{border:1.2pt solid #263238;padding:3mm 4mm;margin-top:3mm;display:flex;justify-content:space-between;align-items:center;font-size:11.5pt;font-weight:700}
.doc .note{font-size:8pt;color:#333;margin:2.5mm 0 0}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:0 10mm;break-inside:avoid}
.doc .sig div{border-top:.8pt solid #111;padding-top:1mm;font-size:8pt;color:#333;margin-top:10mm}
.doc .sigblock{break-inside:avoid}
.doc .wm{border:1.5pt solid #B3261E;color:#B3261E;background:#FDF0EF;font-weight:800;font-size:9pt;padding:1mm 3mm;letter-spacing:1px;text-align:center;margin:0 0 3mm}
.doc .lh{display:flex;justify-content:space-between;gap:6mm;align-items:flex-start}
.doc .lh .bc{text-align:center;font-size:7.5pt}
.doc .lnum{font-size:22pt;font-weight:800;line-height:1}
.doc .vekt{font-size:7.6pt;color:#444;font-style:italic}
.doc .fld{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:3mm 0 2mm;font-size:8.5pt}
.doc .fld div{border-bottom:.8pt solid #111;padding-bottom:4mm;color:#444}
.doc .blankrow td{height:9.5mm}
.doc .foot{margin-top:4mm;font-size:7.5pt;color:#666}
.doc svg.bcd{display:block}
.doc .meth{font-size:7pt;color:#555}
@page{size:A4;margin:12mm 11mm 14mm}
@media print{
  html,body{background:#fff!important}
  body.preview #print-root{position:static;overflow:visible;background:#fff}
  #app,#nav,#topbar,.pv-bar,#toast,#modal-root,#scanner{display:none!important}
  .page{width:auto;max-width:none;min-height:0;margin:0;padding:0;box-shadow:none;overflow:visible}
  .page+.page{break-before:page}
  .doc{font-size:9pt}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="ttl"><b>KRAMBUA VARETELLING</b><span id="tb-sub"></span></div>
    <button id="sync" class="av" data-act="sync-info" title="Deling">● Lokalt</button>
    <button id="tb-tellar" class="pill-btn" data-act="vel-tellar"></button>
  </header>
  <main id="view"></main>
  <nav id="nav">

function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDato(s){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : new Date(s); }
function fmtDato(s){ const d = typeof s === 'string' && s.length === 10 ? parseDato(s) : new Date(s); if (isNaN(d)) return ''; return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); }
function fmtLangDato(s){ const d = parseDato(s); if (isNaN(d)) return ''; return d.getDate()+'. '+MANAD[d.getMonth()]+' '+d.getFullYear(); }
function fmtKl(s){ const d = new Date(s); if (isNaN(d)) return ''; return pad(d.getHours())+':'+pad(d.getMinutes()); }

function parseNum(v){
  if (v == null) return NaN;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/[\s ]/g,'').replace(/kr|nok/gi,'');
  if (!s) return NaN;
  s = s.replace(/[^0-9,.\-]/g,'');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1){ s = lc > ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); }
  else if (lc > -1){ const p = s.split(','); s = p.length > 2 ? p.join('') : s.replace(',','.'); }
  else if (ld > -1){ const p = s.split('.'); if (p.length > 2) s = p.join(''); }
  const n = parseFloat(s);
  return isNaN(n) ? NaN : n;
}

}

  DEFAULT_TELLARAR.forEach(n => { const k = 't-'+slug(n); t.tellarar[k] = {id:k, namn:n, updatedAt:OLD, deleted:false}; });
  return t;
}

  ['tellarar','seksjonar','status','linjer','dobbel'].forEach(k => { if (!t[k] || typeof t[k] !== 'object') t[k] = {}; });

function lineCalc(l){
  const antal = parseNum(l.antal) || 0, pris = parseNum(l.pris) || 0, sats = parseNum(l.mva) || 0;
  const inkl = round2(antal * pris);
  const eks = round2(inkl / (1 + sats / 100));

  const inn = parseNum(l.innpris);
  const av = avanseFor(l.sek);

  if (!isNaN(inn) && inn > 0){ kost = round2(antal * inn); metode = 'I'; }

}

function buildIdx(){

function searchCat(q, max=8){

function ghCfg(){ return Object.assign({}, GH_DEF, lsGet(LS.gh, {})); }
const ghOn = () => !!getToken();
const tellingPath = id => `${ghCfg().dir}/telling-${id}.json`;
const catPath = () => `${ghCfg().dir}/vareliste.json`;
function utf8ToB64(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }

async function ghFetch(url, opt={}){

  if (!opt.method || opt.method === 'GET') url += (url.includes('?') ? '&' : '?') + '_=' + Date.now();
  const res = await fetch(url, {cache:'no-store', ...opt, headers:{'Authorization':'Bearer '+getToken(), 'Accept':'application/vnd.github+json', ...(opt.headers||{})}});

const ghBase = () => { const c = ghCfg(); return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`; };
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

async function ghGetJson(path){
  const res = await ghFetch(`${ghBase()}/contents/${encPath(path)}?ref=${encodeURIComponent(ghCfg().branch)}`);
  if (res.status === 404){ let j = {}; try{ j = await res.json(); }catch(e){} if (/repo|Not Found/i.test(j.message||'') && !(await ghRepoOk())) throw new Error('Fann ikkje repoet '+ghCfg().owner+'/'+ghCfg().repo); return {sha:null, json:null}; }

  else { const r2 = await ghFetch(`${ghBase()}/contents/${encPath(path)}?ref=${encodeURIComponent(ghCfg().branch)}`, {headers:{'Accept':'application/vnd.github.raw+json'}}); if (!r2.ok) throw await ghErr(r2); text = await r2.text(); }

let repoOkCache = null;
async function ghRepoOk(){ if (repoOkCache !== null) return repoOkCache; const r = await ghFetch(ghBase()); repoOkCache = r.ok; return r.ok; }
async function ghPutJson(path, json, sha, msg){
  const body = {message:msg, content:utf8ToB64(JSON.stringify(json)), branch:ghCfg().branch};
  if (sha) body.sha = sha;

const SYNC = {status:'av', last:null, err:'', busy:false, again:false, timer:null, tCommit:{}, cCommit:null, cCheck:0};
function scheduleSync(delay=2500){

}
async function syncNow(force=false){
  if (!ghOn()){ updateSyncUI(); return; }
  if (SYNC.busy){ SYNC.again = true; return; }
  SYNC.busy = true; updateSyncUI();
  try{
    await syncTelling(force);
    await syncCatalog(force);
    SYNC.status = 'ok'; SYNC.last = new Date(); SYNC.err = '';
  }catch(e){ SYNC.status = 'feil'; SYNC.err = e.message || String(e); }

async function syncTelling(force){
  const id = T.id, path = tellingPath(id);
  if (!force && !tDirty && SYNC.tCommit[id]){
    const c = await ghLatestCommit(path);
    if (c === SYNC.tCommit[id]) return;
  }
  for (let attempt = 0; attempt < 4; attempt++){
    const startVer = tVersion;
    const r = await ghGetJson(path);
    if (T.id !== id) return;

    if (stable(merged) !== stable(T)){ T = mergeTelling(T, merged); lsSet(LS.data(T.id), T); refreshLive(); }

      catch(e){ if (e.conflict) continue; throw e; }
    } else {

async function syncCatalog(force){

    SYNC.cCheck = Date.now();

  }
  for (let attempt = 0; attempt < 4; attempt++){
    const r = await ghGetJson(path);
    const merged = r.json ? mergeCat(CAT, r.json) : CAT;
    if (stable(merged) !== stable(CAT)){ CAT = mergeCat(CAT, merged); saveCat(false); refreshLive('cat'); }
    if (!r.json || stable(merged) !== stable(r.json)){
      if (!Object.keys(merged.items).length && !r.json){ catDirty = false; lsSet(LS.catDirty, false); return; }

      catch(e){ if (e.conflict) continue; throw e; }
    } else SYNC.cCommit = await ghLatestCommit(path);

function updateSyncUI(){

const C128 = ['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128Bits(str){
  const vals = [];
  if (/^\d+$/.test(str) && str.length >= 4){
    vals.push(105); const ev = str.length - (str.length % 2);
    for (let i = 0; i < ev; i += 2) vals.push(+str.substr(i, 2));
    if (ev < str.length){ vals.push(100); vals.push(str.charCodeAt(ev) - 32); }
  } else {
    vals.push(104);
    for (const ch of str){ const c = ch.charCodeAt(0); if (c < 32 || c > 126) return null; vals.push(c - 32); }
  }
  let sum = vals[0]; for (let i = 1; i < vals.length; i++) sum += vals[i] * i;
  vals.push(sum % 103); vals.push(106);
  let bits = '';
  vals.forEach(v => { const p = C128[v]; for (let i = 0; i < p.length; i++) bits += (i % 2 === 0 ? '1' : '0').repeat(+p[i]); });
  return bits;
}
const EAN_L = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const EAN_G = ['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const EAN_R = ['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const EAN_P = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanValid(c){
  if (!/^\d+$/.test(c) || ![8,12,13].includes(c.length)) return false;
  const d = c.split('').map(Number), chk = d.pop(); let s = 0;
  d.reverse().forEach((x, i) => s += x * (i % 2 === 0 ? 3 : 1));
  return (10 - s % 10) % 10 === chk;
}
function eanBits(c){
  if (c.length === 12) c = '0' + c;
  const d = c.split('').map(Number);
  if (c.length === 13){
    const p = EAN_P[d[0]]; let b = '101';
    for (let i = 1; i <= 6; i++) b += (p[i-1] === 'L' ? EAN_L : EAN_G)[d[i]];
    b += '01010'; for (let i = 7; i <= 12; i++) b += EAN_R[d[i]]; return b + '101';
  }
  let b = '101'; for (let i = 0; i < 4; i++) b += EAN_L[d[i]]; b += '01010'; for (let i = 4; i < 8; i++) b += EAN_R[d[i]]; return b + '101';
}
function barcodeSVG(code, {h=12, mw=0.3, text=true, fs=2.6}={}){
  code = String(code || '').trim(); if (!code) return '';
  let bits = null;
  if (eanValid(code)) bits = eanBits(code); else bits = code128Bits(code);
  if (!bits) return '';
  const q = 10, W = bits.length + q * 2, th = text ? fs + 0.8 : 0;
  let rects = '', x = 0;
  while (x < bits.length){ if (bits[x] === '1'){ let w = 1; while (bits[x + w] === '1') w++; rects += `<rect x="${x + q}" y="0" width="${w}" height="${h / mw}"/>`; x += w; } else x++; }
  const totalH = h / mw + th / mw;
  return `<svg class="bcd" xmlns="http://www.w3.org/2000/svg" width="${(W * mw).toFixed(2)}mm" height="${(h + th).toFixed(2)}mm" viewBox="0 0 ${W} ${totalH.toFixed(2)}" shape-rendering="crispEdges"><rect width="${W}" height="${totalH.toFixed(2)}" fill="#fff"/><g fill="#000">${rects}</g>${text ? `<text x="${W/2}" y="${(totalH - 0.25/mw).toFixed(2)}" font-family="Arial,Helvetica,sans-serif" font-size="${(fs/mw).toFixed(2)}" text-anchor="middle" fill="#000">${esc(code)}</text>` : ''}</svg>`;
}

/* ------------------------------ kamera-skannar ------------------------------ */
const Scanner = {
  active:false, stream:null, timer:null, reader:null, cb:null, torchOn:false,
  async open(cb){
    this.cb = cb; this.active = true; $('#scanner').hidden = false;
    const video = $('#scan-video');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ this.close(); return this.fail('Kameraet er ikkje tilgjengeleg her. Appen må opnast via https (GitHub Pages).'); }
    try{
      let formats = ['ean_13','ean_8','code_128','upc_a','upc_e','code_39','itf'];
      let useNative = 'BarcodeDetector' in window;
      if (useNative){ try{ const sup = await BarcodeDetector.getSupportedFormats(); formats = formats.filter(f => sup.includes(f)); if (!formats.length) useNative = false; }catch(e){ useNative = false; } }
      if (useNative){
        const det = new BarcodeDetector({formats});
        this.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}, audio:false});
        if (!this.active){ this.stopStream(); return; }
        video.srcObject = this.stream; await video.play();
        const loop = async () => {
          if (!this.active) return;
          try{ const r = await det.detect(video); if (r && r.length && r[0].rawValue){ return this.found(r[0].rawValue); } }catch(e){}
          this.timer = setTimeout(loop, 110);
        };
        loop(); return;
      }
      await loadScript(ZXING_URLS);
      if (!this.active) return;
      const hints = new Map(), F = ZXing.BarcodeFormat;
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.CODE_128, F.UPC_A, F.UPC_E, F.CODE_39, F.ITF]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      this.reader = new ZXing.BrowserMultiFormatReader(hints, 120);
      await this.reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}, audio:false}, video, (res) => { if (res && this.active) this.found(res.getText()); });
    }catch(e){
      this.close();
      this.fail(e && e.name === 'NotAllowedError' ? 'Appen fekk ikkje lov til å bruke kameraet. Gje løyve i nettlesaren og prøv igjen.' : 'Klarte ikkje starte kameraet: ' + (e.message || e));
    }
  },
  fail(msg){ openModal(`<h2>Kamera</h2><p>${esc(msg)}</p><p class="muted small">Du kan òg bruke ein handskannar (Bluetooth/USB) eller skrive inn strekkoden i søkefeltet.</p><div class="btnrow"><button class="btn primary" data-act="modal-close">OK</button></div>`); },
  found(code){ beep(); try{ navigator.vibrate && navigator.vibrate(70); }catch(e){} const cb = this.cb; this.close(); if (cb) cb(String(code).trim()); },
  stopStream(){ const s = this.stream || ($('#scan-video') && $('#scan-video').srcObject); if (s && s.getTracks) s.getTracks().forEach(t => t.stop()); this.stream = null; },
  close(){
    this.active = false; clearTimeout(this.timer);

function mapSVG(st, opt={}){
  let hits = '', badges = '';
  Object.keys(HITS).forEach(id => {
    const [x, y, w, h] = HITS[id]; const s = sekById(id); const ss = st[id] || {n:0, state:0};
    const cls = opt.cls ? opt.cls(id) : 'st' + ss.state;
    hits += `<rect class="hit ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4" data-act="${opt.act || 'sek'}" data-id="${id}"><title>${id} ${esc(s ? s.namn : '')}</title></rect>`;
    if (opt.badge){
      const label = opt.badge(id); if (label == null) return;
      let bx, by;
      if (id === 'L01' || id === 'K01' || id === 'L02'){ bx = x + w - 18; by = y + 14; }
      else if (w < 50){ bx = x + w / 2; by = y + 14; }
      else { bx = x + w - 16; by = y + h / 2; }
      badges += `<g class="badge ${cls}"><rect x="${bx - 15}" y="${by - 8.5}" width="30" height="17" rx="8.5" fill="#263238"/><circle cx="${bx}" cy="${by}" r="0"/><text x="${bx}" y="${by + 3.7}" text-anchor="middle">${esc(label)}</text></g>`;
      return;
    }
    if (ss.n || ss.ferdig){
      let bx, by;
      if (id === 'L01' || id === 'K01' || id === 'L02'){ bx = x + w - 14; by = y + 14; }
      else if (w < 50){ bx = x + w / 2; by = y + 12; }
      else { bx = x + w - 11; by = y + h / 2; }
      const label = ss.ferdig ? '✓' : (ss.n > 99 ? '99+' : ss.n);
      badges += `<g class="badge st${ss.state}"><circle cx="${bx}" cy="${by}" r="${String(label).length > 2 ? 12 : 9.5}"/><text x="${bx}" y="${by + 3.7}" text-anchor="middle">${label}</text></g>`;
    }
  });
  return `<svg class="map" viewBox="152 152 626 978" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Butikkart – trykk på ein reol">${MAP_STATIC}${hits}${badges}</svg>`;
}

function summary(){
  const sek = allSek(), lines = activeLines();
  const perMva = {}, perSek = {}, perTellar = {}, perOmr = {};
  MVA_SATSAR.forEach(m => perMva[m] = {n:0, inkl:0, mva:0, eks:0, kost:0});
  sek.forEach(s => perSek[s.id] = {n:0, inkl:0, eks:0, kost:0, tellarar:{}});
  const tot = {n:0, inkl:0, mva:0, eks:0, kost:0, kostI:0, kostA:0, utanPris:0, vekt:0, tid0:null, tid1:null};
  const rows = lines.map(l => {
    const c = lineCalc(l);
    const m = perMva[l.mva] || (perMva[l.mva] = {n:0, inkl:0, mva:0, eks:0, kost:0});
    m.n++; m.inkl += c.inkl; m.mva += c.mva; m.eks += c.eks; m.kost += c.kost;
    const s = perSek[l.sek] || (perSek[l.sek] = {n:0, inkl:0, eks:0, kost:0, tellarar:{}});
    s.n++; s.inkl += c.inkl; s.eks += c.eks; s.kost += c.kost; s.tellarar[l.tellar] = (s.tellarar[l.tellar] || 0) + 1;
    perTellar[l.tellar] = (perTellar[l.tellar] || 0) + 1;
    const sk = sekById(l.sek); const o = sk ? sk.omr : 'X'; perOmr[o] = (perOmr[o] || 0) + c.kost;
    tot.n++; tot.inkl += c.inkl; tot.mva += c.mva; tot.eks += c.eks; tot.kost += c.kost;
    if (c.metode === 'I') tot.kostI += c.kost; else tot.kostA += c.kost;
    if (!(parseNum(l.pris) > 0)) tot.utanPris++;
    if (l.modus === 'vekt') tot.vekt++;
    if (!tot.tid0 || l.tid < tot.tid0) tot.tid0 = l.tid;
    if (!tot.tid1 || l.tid > tot.tid1) tot.tid1 = l.tid;
    return {l, c};
  });
  Object.values(perMva).forEach(m => { m.inkl = round2(m.inkl); m.mva = round2(m.mva); m.eks = round2(m.eks); m.kost = round2(m.kost); });
  ['inkl','mva','eks','kost','kostI','kostA'].forEach(k => tot[k] = round2(tot[k]));
  const ukurans = round2(parseNum(T.meta.ukurans) || 0);
  tot.balanse = round2(tot.kost - ukurans); tot.ukurans = ukurans;
  const ikkjeFerdig = sek.filter(s => !(T.status[s.id] && T.status[s.id].ferdig));
  const tomme = sek.filter(s => !perSek[s.id].n);
  return {sek, rows, perMva, perSek, perTellar, perOmr, tot, ikkjeFerdig, tomme};
}
async function kontrollsum(S){
  const txt = S.rows.map(({l}) => [l.id, l.sek, l.namn, l.antal, l.pris, l.mva, l.eining].join('|')).join('\n');
  try{ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return Array.from(new Uint8Array(buf)).slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase(); }
  catch(e){ let h = 0x811c9dc5; for (let i = 0; i < txt.length; i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).toUpperCase().padStart(8, '0'); }
}

function listerItems(sekId, kjeldeId){
  const map = new Map();
  const add = l => { const k = l.key || l.ean || l.varenr || l.namn.toLowerCase(); if (!map.has(k)){ const it = l.key && CAT.items[l.key] ? CAT.items[l.key] : null; map.set(k, {namn:it ? it.namn : l.namn, varenr:it ? it.varenr : l.varenr, ean:it ? (it.ean || [])[0] || '' : l.ean, eining:l.eining}); } };
  const src = kjeldeId === T.id ? T : normTelling(lsGet(LS.data(kjeldeId), null) || nyTelling(kjeldeId));
  Object.values(src.linjer).filter(l => !l.deleted && l.sek === sekId).forEach(add);
  Object.values(CAT.items).filter(it => !it.deleted && it.sek === sekId).forEach(it => add({key:it.k, namn:it.namn, varenr:it.varenr, ean:(it.ean || [])[0], eining:it.eining}));
  return [...map.values()].sort((a,b) => a.namn.localeCompare(b.namn, 'nb'));
}

function parseCSV(text){
  const first = text.split(/\r?\n/).slice(0, 5).join('\n');
  const cands = [';', '\t', ',', '|']; let sep = ';', best = -1;
  cands.forEach(c => { const n = first.split(c).length; if (n > best){ best = n; sep = c; } });
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows;
}

function salGeneriskCfg(){

const vnrOf = l => l.varenr || (l.key && CAT.items[l.key] && CAT.items[l.key].varenr) || '';
function analyse(){
  if (!SAL.meta) return null;
  const fak = 12 / (parseNum(SAL.meta.periodeMnd) || 12);
  const lines = activeLines();
  const per = {};
  const mk = () => ({uts:0, kost:0, salDir:0, salGen:0, kjentUts:0, n:0, utanSal:0, utanSalKost:0});
  allSek().forEach(s => per[s.id] = mk());
  const qtyV = {};
  lines.forEach(l => { const v = vnrOf(l); if (v) qtyV[v] = (qtyV[v] || 0) + (parseNum(l.antal) || 0); });
  const gen = salGeneriskCfg();
  const genSek = new Set(); Object.values(gen).forEach(g => { if (g.sum > 0) g.sek.forEach(id => genSek.add(id)); });
  const varer = new Map();
  lines.forEach(l => {
    const c = lineCalc(l); const p = per[l.sek] || (per[l.sek] = mk());
    p.uts += c.eks; p.kost += c.kost; p.n++;
    const v = vnrOf(l), si = v ? SAL.items[v] : null;
    let salEks = null;
    if (si && !si.generisk) salEks = Math.max(0, si.sum) * ((parseNum(l.antal) || 0) / (qtyV[v] || 1)) * fak / (1 + (+l.mva || 0) / 100);
    else if (v && SAL.meta.komplett && !si) salEks = 0;
    if (salEks !== null){ p.salDir += salEks; p.kjentUts += c.eks; if (salEks <= 0){ p.utanSal++; p.utanSalKost += c.kost; } }
    else if (genSek.has(l.sek)) p.kjentUts += c.eks;
    const k = grpKey(l);
    const a = varer.get(k) || {namn:l.namn, varenr:v, kost:0, uts:0, salEks:0, kjent:true, sek:new Set(), antal:0, eining:l.eining};
    a.kost += c.kost; a.uts += c.eks; a.antal += parseNum(l.antal) || 0; a.sek.add(l.sek);
    if (salEks === null) a.kjent = false; else a.salEks += salEks;
    varer.set(k, a);
  });
  Object.values(gen).forEach(g => {
    if (!g.sek.length || !(g.sum > 0)) return;
    const salEks = g.sum * fak / (1 + g.mva / 100);
    const tot = g.sek.reduce((s, id) => s + (per[id] ? per[id].uts : 0), 0);
    g.sek.forEach(id => { if (!per[id]) return; per[id].salGen += salEks * (tot > 0 ? per[id].uts / tot : 1 / g.sek.length); });
    g.salEksAr = salEks;
  });
  const tot = mk();
  Object.values(per).forEach(p => {
    p.sal = p.salDir + p.salGen;
    p.dekning = p.uts > 0 ? Math.min(1, p.kjentUts / p.uts) : 0;
    p.omlop = p.uts > 0 ? p.sal / p.uts : null;
    p.dagar = p.uts > 0 ? (p.omlop > 0 ? 365 / p.omlop : Infinity) : null;
    ['uts','kost','salDir','salGen','kjentUts','n','utanSal','utanSalKost'].forEach(k => tot[k] += p[k]);
  });
  tot.sal = tot.salDir + tot.salGen; tot.dekning = tot.uts > 0 ? tot.kjentUts / tot.uts : 0; tot.dagar = tot.sal > 0 ? 365 * tot.uts / tot.sal : null;
  const vl = [...varer.values()].map(a => ({...a, dagar:a.kjent ? (a.salEks > 0 ? 365 * a.uts / a.salEks : Infinity) : null}));
  return {per, tot, gen, fak, varer:vl};
}
function heatCls(p){

function saveOppsett(){
  const M = T.meta;
  const av = parseNum($('#o-avanse').value); if (isNaN(av) || av < 0 || av >= 100) return toast('Avansen må vere mellom 0 og 99 %', 'err');
  const avo = {}; document.querySelectorAll('[data-avo]').forEach(i => { const v = parseNum(i.value); if (!isNaN(v)) avo[i.dataset.avo] = v; });
  Object.assign(M, {namn:$('#o-namn').value.trim() || M.namn, perDato:$('#o-per').value || M.perDato, firma:$('#o-firma').value.trim(), orgnr:$('#o-orgnr').value.trim(), stad:$('#o-stad').value.trim(), avanse:av, avanseOmr:avo, ukurans:parseNum($('#o-ukurans').value) || 0, ukuransTekst:$('#o-ukt').value.trim(), updatedAt:nowISO()});
  saveLocal(); renderTop(); toast('Lagra', 'ok');
}

/* ------------------------------ JSON ------------------------------ */
function jsonUt(){
  const data = {app:'krambua-varetelling', ver:APP_VER, eksportert:nowISO(), telling:T, vareliste:CAT};
  download(`Varetelling_${T.id}_${todayISO()}.json`, new Blob([JSON.stringify(data)], {type:'application/json'}));
}
async function jsonInn(file){
  try{
    const d = JSON.parse(await file.text());
    const t = d.telling || d;
    if (!t.linjer) throw new Error('Fila er ikkje ein varetellings-kopi');
    if (String(t.id) !== T.id) return confirmBox('Anna telling', `Fila gjeld telling «${esc(t.id)}», men du har opna «${esc(T.id)}». Slå saman likevel?`, 'Slå saman', () => doMerge(t, d.vareliste));
    doMerge(t, d.vareliste);
  }catch(e){ toast('Klarte ikkje lese fila: ' + e.message, 'err'); }
}
function doMerge(t, cat){
  const before = activeLines().length;
  t = {...t, id:T.id};
  T = mergeTelling(T, t); saveLocal();
  if (cat && cat.items){ CAT = mergeCat(CAT, cat); saveCat(); }
  render(); toast(`Slått saman: ${activeLines().length - before} nye linjer`, 'ok');
}

function openTelling(id){

document.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]'); if (n){ go(n.dataset.nav); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const fn = ACT[a.dataset.act]; if (!fn) return;
  if (a.dataset.act === 'modal-bg'){ if (e.target === a) closeModal(); return; }
  if (a.tagName === 'BUTTON' || a.tagName === 'A') e.preventDefault();
  fn(a, e);
});
let suggTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'kode'){ clearTimeout(suggTimer); suggTimer = setTimeout(() => { const v = t.value.trim(); if (/^\d{6,}$/.test(v)) { $('#forslag').innerHTML = ''; return; } renderSugg(v); }, 140); return; }
  if (t.id === 'cat-q'){ clearTimeout(suggTimer); suggTimer = setTimeout(() => renderCatList(t.value), 150); return; }
  const f = t.dataset.f; if (!f || !draft) return;
  const v = t.type === 'checkbox' ? t.checked : t.value;
  if (f.startsWith('v.')) draft.vekt[f.slice(2)] = v; else draft[f] = v;
  if (f === 'eining' && draft.modus === 'vekt') { showForm(draft, '#f-total'); return; }
  updateCalc();
});
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.f === 'eining' && draft){ draft.eining = t.value; if (draft.modus === 'vekt') showForm(draft, '#f-total'); else updateCalc(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#modal-root').innerHTML) closeModal(); else if (!$('#scanner').hidden) Scanner.close(); else if (document.body.classList.contains('preview')) closePreview(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'kode'){ e.preventDefault(); handleCode(t.value); return; }
  if (t.id === 'ny-tellar'){ e.preventDefault(); ACT['add-tellar'](); return; }
  if (t.id === 'cat-q'){ e.preventDefault(); const it = lookupCode(t.value); if (it) catEdit(it.k); return; }
  if (draft && t.closest && t.closest('#vareform') && t.tagName === 'INPUT'){
    e.preventDefault();
    if (t.id === 'f-antal' || t.id === 'f-total') return saveDraft();
    const ins = [...document.querySelectorAll('#vareform input[type=text]')]; const i = ins.indexOf(t);
    if (i > -1 && i < ins.length - 1) ins[i + 1].focus(); else saveDraft();
  }
});
